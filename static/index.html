// ── Multi-file edits (Ctrl+I) ─────────────────────────────────────────────────
// Plan which files a change touches, write each one, then review every diff before anything is saved.
const ME = { open: false, files: [], cur: -1, ctl: null, root: '', last: null, working: false };
let multiDiff = null, multiEmpty = null;
const BINARY_EXT = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico', 'avif', 'pdf', 'zip', 'gz', 'tgz', 'xz', 'bz2', '7z', 'rar', 'zst', 'mp3', 'mp4',
  'mkv', 'webm', 'wav', 'flac', 'ogg', 'woff', 'woff2', 'ttf', 'otf', 'so', 'o', 'a', 'bin', 'exe', 'dll', 'class', 'jar', 'pyc', 'gguf', 'safetensors', 'onnx', 'lock']);
const FULL_REWRITE_MAX_LINES = 160;
const MULTI_PLAN_SYSTEM = 'You plan code changes across a software project. Given the file list, some file contents, search results and an instruction, ' +
  'decide exactly which files must be edited, created or deleted to fulfil the instruction. Include every file that needs a change ' +
  '(callers of renamed functions, imports, tests, config, docs) and nothing else. Use paths exactly as listed, relative to the project root; ' +
  'new files may use new paths. Reply with JSON only.';
const PLAN_SCHEMA = { type: 'object', required: ['files'], properties: { files: { type: 'array', items: { type: 'object', required: ['path', 'action', 'reason'],
  properties: { path: { type: 'string' }, action: { type: 'string', enum: ['edit', 'create', 'delete'] }, reason: { type: 'string' } } } } } };
const FULL_SYSTEM = 'You are a precise code-editing engine working on one file of a multi-file change. Reply with exactly ONE fenced code block ' +
  'containing the complete new content of the file, and nothing before or after it. Keep everything that should not change exactly as it is.';
const BLOCKS_SYSTEM = 'You are a precise code-editing engine working on one file of a multi-file change. Reply only with edit blocks in exactly this format:\n' +
  '<<<<<<< SEARCH\n(lines copied exactly from the current file)\n=======\n(replacement lines)\n>>>>>>> REPLACE\n' +
  'The SEARCH part must match the current file exactly, including indentation. Use several small blocks rather than one big one. No other text.';

function normPath(p) {
  const out = [];
  for (const seg of p.split('/')) { if (!seg || seg === '.') continue; if (seg === '..') out.pop(); else out.push(seg); }
  return '/' + out.join('/');
}
function langForPath(p) {
  const name = basename(p).toLowerCase(), ext = '.' + extOf(name);
  return monaco.languages.getLanguages().find(l => (l.filenames || []).some(f => f.toLowerCase() === name) || (l.extensions || []).includes(ext))?.id || 'plaintext';
}
function lineDelta(a, b) {
  if (!a) return { adds: b ? b.split('\n').length : 0, dels: 0 };
  const count = new Map();
  for (const l of a.split('\n')) count.set(l, (count.get(l) || 0) + 1);
  let adds = 0, dels = 0;
  for (const l of b.split('\n')) { const c = count.get(l); if (c) count.set(l, c - 1); else adds++; }
  for (const c of count.values()) dels += c;
  return { adds, dels };
}
function extractCode(t, greedy) {
  t = t.replace(/\r/g, '');
  const open = t.match(/```[^\n]*\n/);
  if (!open) return t.replace(/^\n+/, '').replace(/\s+$/, '');
  const start = open.index + open[0].length;
  const end = greedy ? t.lastIndexOf('```') : t.indexOf('```', start);
  return t.slice(start, end >= start ? end : undefined).replace(/\n$/, '');
}
function matchLoose(text, search) {
  const tl = text.split('\n'), sl = search.split('\n').map(s => s.trim());
  while (sl.length && !sl[0]) sl.shift();
  while (sl.length && !sl[sl.length - 1]) sl.pop();
  if (!sl.length) return null;
  for (let i = 0; i + sl.length <= tl.length; i++) {
    let ok = true;
    for (let j = 0; j < sl.length && ok; j++) ok = tl[i + j].trim() === sl[j];
    if (ok) {
      const start = i ? tl.slice(0, i).join('\n').length + 1 : 0;
      return { start, end: start + tl.slice(i, i + sl.length).join('\n').length };
    }
  }
  return null;
}
function applyEditBlocks(original, out) {
  const re = /<{5,9} ?SEARCH\n([\s\S]*?)\n?={5,9}\n([\s\S]*?)\n?>{5,9} ?REPLACE/g;
  let text = original, applied = 0, failed = 0, m;
  while ((m = re.exec(out))) {
    const [, search, replace] = m;
    if (!search.trim()) { failed++; continue; }
    if (text.includes(search)) { text = text.replace(search, () => replace); applied++; continue; }
    const loose = matchLoose(text, search);
    if (loose) { text = text.slice(0, loose.start) + replace + text.slice(loose.end); applied++; } else failed++;
  }
  return { text, applied, failed, error: applied ? '' : failed ? "None of ocode's edits matched the file" : 'ocode returned no edits for this file' };
}
function gatherContext(root, exclude, budget = 24000) {
  let out = '';
  for (const p of [active, ...tabs.keys()].filter((p, i, a) => p && a.indexOf(p) === i)) {
    const t = tabs.get(p);
    if (t?.kind !== 'text' || p === exclude || !p.startsWith(root + '/') || (p === active && S.shareActiveFile === false)) continue;
    const text = t.model.getValue().slice(0, Math.min(8000, budget));
    if (!text) continue;
    out += `<file path="${p.slice(root.length + 1)}">\n${text}\n</file>\n\n`;
    budget -= text.length;
    if (budget < 1000) break;
  }
  return out;
}
async function searchHints(instruction, root) {
  const tokens = new Set();
  for (const m of instruction.matchAll(/`([^`]{2,60})`|"([^"]{2,60})"|'([^']{2,60})'/g)) tokens.add(m[1] || m[2] || m[3]);
  for (const m of instruction.matchAll(/\b([a-z]+[A-Z]\w*|[A-Za-z]\w*_\w+|[A-Z][a-z]+[A-Z]\w*)\b/g)) tokens.add(m[1]);
  let out = '';
  for (const tok of [...tokens].slice(0, 5)) {
    try {
      const res = await api(`/api/search?q=${enc(tok)}&path=${enc(root)}&case=1`);
      if (res.length) out += `Search results for "${tok}":\n` + res.slice(0, 15).map(r => `${r.path.slice(root.length + 1)}:${r.line}: ${r.text.trim().slice(0, 160)}`).join('\n') + '\n\n';
    } catch {}
  }
  return out;
}

async function planMultiEdit(instruction, root, signal) {
  const { files } = await api('/api/find-files?path=' + enc(root));
  const textFiles = files.filter(f => !BINARY_EXT.has(extOf(basename(f))));
  const listed = textFiles.slice(0, 400), known = new Set(textFiles);
  const prompt = `Project folder: ${basename(root)}\n\nFiles (${textFiles.length}${textFiles.length > listed.length ? `, first ${listed.length} shown` : ''}):\n${listed.join('\n')}\n\n` +
    `${gatherContext(root)}${await searchHints(instruction, root)}Instruction: ${instruction}\n\nList every file to edit, create or delete.`;
  const out = await streamText('/api/ai', { system: MULTI_PLAN_SYSTEM, prompt, format: PLAN_SCHEMA, temperature: 0.1, think: thinkOn(), maxTokens: 1500 + thinkBudget() }, signal);
  let data;
  try { data = JSON.parse(out); } catch { const m = out.match(/\{[\s\S]*\}/); try { data = m ? JSON.parse(m[0]) : {}; } catch { data = {}; } }
  const seen = new Set(), plan = [];
  for (const f of data.files || []) {
    const raw = String(f.path || '').trim();
    if (!raw) continue;
    const abs = normPath(raw.startsWith('/') ? raw : join(root, raw));
    if (seen.has(abs) || !abs.startsWith(root + '/')) continue;
    seen.add(abs);
    const rel = abs.slice(root.length + 1), exists = known.has(rel) || tabs.has(abs);
    let action = ['edit', 'create', 'delete'].includes(f.action) ? f.action : exists ? 'edit' : 'create';
    if (action === 'edit' && !exists) action = 'create';
    if (action === 'create' && exists) action = 'edit';
    if (action === 'delete' && !exists) continue;
    plan.push({ rel, abs, action, existed: exists, reason: String(f.reason || '').slice(0, 300) });
    if (plan.length >= 12) break;
  }
  return plan;
}

async function generateFileEdit(f, instruction, signal) {
  const lang = langForPath(f.abs), t = tabs.get(f.abs);
  let original = '';
  if (f.existed) original = t?.kind === 'text' ? t.model.getValue() : ((await api('/api/file?path=' + enc(f.abs))).content ?? '');
  f.originalText = original;
  f.original = monaco.editor.createModel(original, lang);
  if (f.action === 'delete') { f.modified = monaco.editor.createModel('', lang); f.state = 'delete'; updateCounts(f); return; }
  if (original.length > 120000) throw new Error('Too large for a multi-file edit — select a section and use Ctrl+K');
  const plan = ME.files.map(x => `- ${x.rel} (${x.action}): ${x.reason}`).join('\n');
  const related = gatherContext(ME.root, f.abs, 8000);
  const useBlocks = !!original && original.split('\n').length > FULL_REWRITE_MAX_LINES;
  const greedy = lang === 'markdown' || original.includes('```');
  const head = `Overall instruction: ${instruction}\n\nPlanned changes:\n${plan}\n\nYou are now handling ${f.rel} (${f.action}): ${f.reason}\n\n` +
    (related ? `Related files, for reference only:\n${related}` : '');
  const current = original ? `Current content of ${f.rel}:\n\`\`\`${lang}\n${original}\n\`\`\`\n\n` : '';
  const req = useBlocks
    ? { system: BLOCKS_SYSTEM, prompt: `${head}${current}Reply with SEARCH/REPLACE blocks for ${f.rel} only.`, maxTokens: 2500 }
    : { system: FULL_SYSTEM, prompt: `${head}${current}Reply with the complete new content of ${f.rel} in one \`\`\`${lang} code block.`, maxTokens: Math.ceil(original.length / 3) + 1500 };
  const ctl = new AbortController(), forward = () => ctl.abort();
  signal.addEventListener('abort', forward);
  let out = '', gotBlock = false;
  try {

async function showReadme({ title, readme, source }) {
  let text;
  try { text = (await api('/api/file?path=' + enc(readme))).content; }
  catch (e) { toast(`Couldn't open ${basename(readme)}: ${e.message}`, 'error'); return; }
  const dir = dirname(readme);
  openSidePanel({ title: `${title} · README`, render: el => {
    const doc = renderMarkdown(text);
    doc.classList.add('readme-view');
    // Keep link clicks inside the app: web links open in the browser, relative links open the file (READMEs as READMEs).
    doc.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      const href = a.getAttribute('href') || '';
      if (/^https?:\/\//.test(href)) { post('/api/open-external', { url: href }); return; }
      if (!href || href.startsWith('#')) {
        const id = href.slice(1);
        [...doc.querySelectorAll('h1,h2,h3,h4')].find(hd => hd.textContent.trim().toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-') === id)?.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      const target = normPath(join(dir, decodeURIComponent(href.split('#')[0])));
      if (target.endsWith('.md')) showReadme({ title: basename(dirname(target)) === basename(INFO.pluginDir) ? 'Plugin guide' : basename(dirname(target)), readme: target });
      else openFile(target);
    });
    el.append(h('div', { class: 'readme-bar' },
      h('button', { class: 'btn', onclick: () => openFile(readme) }, 'Edit README'),
      source ? h('button', { class: 'btn', onclick: () => openFile(source) }, 'Edit source') : null), doc);
  } });
}

  dragSplit($('#split-sidebar'), $('#sidebar'), 'x', 1, 'sidebarWidth', 170, () => innerWidth * 0.45);
  dragSplit($('#split-chat'), $('#chat'), 'x', -1, 'chatWidth', 300, () => innerWidth * 0.6);
  dragSplit($('#term-split'), $('#term-panel'), 'y', -1, 'termHeight', 90, () => innerHeight * 0.8);

  for (const b of $$('.ptab')) b.onclick = () => setPanelTab(b.dataset.ptab);
  $('#outline-filter').addEventListener('input', renderOutline);
  $('#search-input').addEventListener('input', runSearch);
  $('#search-input').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  for (const [id, key] of [['#search-case', 'case'], ['#search-regex', 'regex']]) $(id).onclick = () => { search[key] = !search[key]; $(id).classList.toggle('on', search[key]); runSearch(); };

  const input = $('#chat-input');
  input.addEventListener('input', () => { autosizeInput(); slashSel = 0; renderSlash(); });
  input.addEventListener('click', () => renderSlash());
  input.addEventListener('blur', () => setTimeout(() => $('#slash').classList.remove('open'), 120));
  input.addEventListener('keydown', e => {
    const open = $('#slash').classList.contains('open');
    if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const n = popupItems().length || 1; slashSel = (slashSel + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; renderSlash(); return; }
    if (open && (e.key === 'Tab' || e.key === 'Enter') && !e.shiftKey) { e.preventDefault(); pickPopup(popupItems()[slashSel]); return; }
    if (open && e.key === 'Escape') { $('#slash').classList.remove('open'); return; }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = input.value; input.value = ''; autosizeInput(); sendChat(v); }
    if (e.key === 'Escape' && busy) abortCtl?.abort();
  });
  $('#send-btn').onclick = () => { if (busy) { abortCtl?.abort(); return; } const v = input.value; input.value = ''; autosizeInput(); sendChat(v); };
  $('#ci-model').onclick = e => runCommand('ai.model', e.currentTarget);
  $('#ci-effort').onclick = e => runCommand('ai.effort', e.currentTarget);
  $('#ci-file').onclick = () => setSettings({ shareActiveFile: S.shareActiveFile === false });
  $('#ci-mode').onclick = () => setUnrestricted(!S.unrestricted);
  $('#messages').addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a) { e.preventDefault(); const href = a.getAttribute('href') || ''; if (/^https?:\/\//.test(href)) post('/api/open-external', { url: href }).catch(err => toast(err.message, 'error')); else if (href && !href.startsWith('#')) openFile(absPath(href.replace(/^file:\/\//, ''))); return; }
    const c = e.target.closest('code.path-link');
    if (c) { const [, p, ln] = c.textContent.trim().match(/^(.*?)(?::(\d+))?$/); openFile(absPath(p), ln ? { line: +ln } : {}); }
  });

  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
  window.addEventListener('focus', async () => {
    refreshTreeSoon(); invalidateFileIndex();
    for (const p of tabs.keys()) await reloadIfOpen(p);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  [S, INFO] = await Promise.all([api('/api/settings'), api('/api/info')]);
  await new Promise((res, rej) => { require.config({ paths: { vs: '/static/vendor/monaco/vs' } }); require(['vs/editor/editor.main'], res, rej); });
  for (const [id, t] of Object.entries(THEMES)) monaco.editor.defineTheme('t-' + id, monacoTheme(t));
  applyTheme(S.theme);
  createEditor();
  registerAiProviders();
  registerSymbolProviders();
  buildStatusbar();
  checkCompleteStatus();
  setInterval(() => { if (S.aiComplete !== false && (!AIC.status?.online || !AIC.status?.hasModel)) checkCompleteStatus(); }, 20000);
  wireUI();
  registerBuiltins();
  applyLayout();
  setBusy(false);
  renderChatEmpty();
  let start = S.cwd || INFO.home;
  try { await api('/api/files?path=' + enc(start)); } catch { start = INFO.home; }
  S.cwd = start;
  selectView('explorer');
  await initTerm();
  await setCwd(start, { noSave: true });
  await loadPlugins();
  applyTheme(S.theme);
  const restore = S.openTabs || [], restoreActive = S.activeTab;
  for (const p of restore) await openFile(p, { silent: true, noFocus: true });
  activate(restoreActive && tabs.has(restoreActive) ? restoreActive : [...tabs.keys()].pop() || null, { noFocus: true });
  loadModels().then(renderChrome);
  warmModel();
  renderChrome();
  emit('ready');
  (editor.getModel() ? editor : $('#chat-input')).focus();
}
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:auto 20px 40px;padding:14px;background:#401a1a;color:#fbb;border-radius:8px;font:13px monospace;z-index:9999">ocode failed to start: ${esc(e.message)}</div>`); });
</script>
</body>
