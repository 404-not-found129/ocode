// ── Built-in commands ─────────────────────────────────────────────────────────
function registerBuiltins() {
  const C = (id, label, run, keys, extra = {}) => registerCommand({ id, label, run, keys, ...extra });
  const hasText = () => tabs.get(active)?.kind === 'text';
  C('quickOpen', 'Go to File…', () => quickOpen(), 'Ctrl+P', { global: true });
  C('palette', 'Show All Commands', palette, 'Ctrl+Shift+P', { global: true });
  C('file.new', 'File: New File…', () => newFile(active ? dirname(active) : S.cwd), 'Ctrl+N');
  C('file.newFolder', 'File: New Folder…', () => newFolder());
  C('file.openFolder', 'File: Open Folder…', async () => { const p = await pickFolder(); if (p) setCwd(p); }, 'Ctrl+O', { global: true });
  C('file.save', 'File: Save', () => saveTab(tabs.get(active), true), 'Ctrl+S');
  C('file.saveAll', 'File: Save All', saveAll, 'Ctrl+Alt+S');
  C('file.close', 'File: Close Tab', () => active && closeTab(active), 'Ctrl+W');
  C('file.closeAll', 'File: Close All Tabs', async () => { for (const p of [...tabs.keys()]) await closeTab(p); });
  C('file.nextTab', 'File: Next Tab', () => cycleTab(1), 'Ctrl+PageDown');
  C('file.prevTab', 'File: Previous Tab', () => cycleTab(-1), 'Ctrl+PageUp');
  C('file.rename', 'File: Rename Active File…', () => active && renamePath(active));
  C('file.reveal', 'File: Reveal Active File in Explorer', () => { if (active) { showView('explorer', true); revealInTree(active); } });
  C('file.copyPath', 'File: Copy Path of Active File', () => active && copyText(active));
  C('view.sidebar', 'View: Toggle Sidebar', () => togglePanel('sidebar'), 'Ctrl+B', { global: true });
  C('view.terminal', 'View: Toggle Terminal', () => togglePanel('term'), 'Ctrl+`', { global: true });
  C('view.terminal2', 'View: Toggle Panel', () => togglePanel('term'), 'Ctrl+J', { global: true, hidden: true });
  C('view.chat', 'View: Toggle Chat', () => togglePanel('chat'), 'Ctrl+Alt+B', { global: true });
  C('view.explorer', 'View: Explorer', () => showView('explorer', true), 'Ctrl+Shift+E', { global: true });
  C('view.search', 'View: Search in Folder', () => showView('search', true), 'Ctrl+Shift+F', { global: true });
  C('view.plugins', 'View: Plugins', () => showView('plugins', true), 'Ctrl+Shift+X', { global: true });
  C('view.settings', 'Preferences: Open Settings', () => showView('settings', true), 'Ctrl+,', { global: true });
  C('view.zoomIn', 'View: Zoom In', () => setSettings({ fontSize: Math.min(40, S.fontSize + 1), terminalFontSize: Math.min(32, S.terminalFontSize + 1) }), 'Ctrl+=');
  C('view.zoomOut', 'View: Zoom Out', () => setSettings({ fontSize: Math.max(8, S.fontSize - 1), terminalFontSize: Math.max(8, S.terminalFontSize - 1) }), 'Ctrl+-');
  C('view.zoomReset', 'View: Reset Zoom', () => setSettings({ fontSize: 14, terminalFontSize: 13 }), 'Ctrl+0');
  C('view.wordWrap', 'View: Toggle Word Wrap', () => setSettings({ wordWrap: S.wordWrap === 'off' ? 'on' : 'off' }), 'Alt+Z');
  C('view.minimap', 'View: Toggle Minimap', () => setSettings({ minimap: !S.minimap }));
  C('view.hidden', 'View: Toggle Hidden Files', () => setSettings({ showHidden: !S.showHidden }));
  C('pref.theme', 'Preferences: Color Theme', pickTheme, 'Ctrl+Alt+T');
  C('pref.settingsJson', 'Preferences: Open settings.json', () => openFile(INFO.settingsFile));
  C('pref.pluginsFolder', 'Preferences: Open Plugins Folder', () => { setCwd(INFO.pluginDir); showView('explorer', true); });
  C('dev.reload', 'Developer: Reload Window', () => location.reload());
  C('editor.format', 'Editor: Format Document', () => editor.getAction('editor.action.formatDocument')?.run(), undefined, { when: hasText });
  C('editor.gotoLine', 'Editor: Go to Line…', () => quickOpen(':'), 'Ctrl+G', { when: hasText });
  C('editor.find', 'Editor: Find', () => editor.trigger('cmd', 'actions.find'), undefined, { when: hasText });
  C('editor.replace', 'Editor: Replace', () => editor.trigger('cmd', 'editor.action.startFindReplaceAction'), undefined, { when: hasText });
  C('editor.monacoCommands', 'Editor: Show Editor Commands', () => { editor.focus(); editor.trigger('cmd', 'editor.action.quickCommand'); }, 'F1', { when: hasText });
  C('editor.language', 'Editor: Change Language Mode…', async () => {
    const m = editor.getModel(); if (!m) return;
    const id = await askPick('Select language mode', monaco.languages.getLanguages().map(l => ({ label: l.aliases?.[0] || l.id, detail: l.id, value: l.id })));
    if (id) { monaco.editor.setModelLanguage(m, id); renderStatus(); }
  });
  C('editor.indentation', 'Editor: Change Indentation…', async () => {
    const m = editor.getModel(); if (!m) return;
    const v = await askPick('Indentation for this file', [
      ...[2, 4, 8].map(n => ({ label: `Indent Using Spaces: ${n}`, value: { insertSpaces: true, tabSize: n } })),
      ...[2, 4, 8].map(n => ({ label: `Indent Using Tabs: ${n}`, value: { insertSpaces: false, tabSize: n } })),
      { label: 'Detect from Content', value: 'detect' },
      { label: 'Convert Indentation to Spaces', value: 'toSpaces' }, { label: 'Convert Indentation to Tabs', value: 'toTabs' }]);
    if (v === 'detect') m.detectIndentation(S.insertSpaces, S.tabSize);
    else if (v === 'toSpaces') editor.trigger('cmd', 'editor.action.indentationToSpaces');
    else if (v === 'toTabs') editor.trigger('cmd', 'editor.action.indentationToTabs');
    else if (v) m.updateOptions(v);
    renderStatus();
  });
  C('editor.toggleEol', 'Editor: Toggle Line Endings (LF/CRLF)', () => { const m = editor.getModel(); if (!m) return; m.setEOL(m.getEOL() === '\n' ? monaco.editor.EndOfLineSequence.CRLF : monaco.editor.EndOfLineSequence.LF); renderStatus(); });
  C('run.file', 'Run: Run Active File', () => runFile(), 'F5', { global: true });
  C('terminal.new', 'Terminal: Restart Shell', () => { term.reset(); connectTerm(); setPanel('term', true); term.focus(); });
  C('terminal.clear', 'Terminal: Clear', () => term.clear());
  C('terminal.focus', 'Terminal: Focus', () => { setPanel('term', true); term.focus(); });
  C('terminal.maximize', 'Terminal: Toggle Maximized Panel', () => { setPanel('term', true); $('#center').classList.toggle('term-max'); setTimeout(fitTerm, 0); });
  C('terminal.runSelection', 'Terminal: Run Selected Text', () => { const m = editor.getModel(); const s = m && m.getValueInRange(editor.getSelection()); if (s) runInTerminal(s); else toast('Select some text first', 'warn'); });
  C('ai.askSelection', 'ocode: Add Selection to Chat', () => { const s = selectionSnippet(); setPanel('chat', true); if (s) insertIntoChat(s + '\n'); else $('#chat-input').focus(); }, 'Ctrl+L');
  C('ai.explainSelection', 'ocode: Explain Selection or File', () => { const s = selectionSnippet(); if (s) sendChat(`Explain this code:\n${s}`); else if (active) sendChat(`Explain what ${rel(active)} does.`); else toast('Open a file first', 'warn'); });
  C('ai.fixSelection', 'ocode: Fix Selection or File', () => { const s = selectionSnippet(); if (s) sendChat(`Find and fix bugs in this code, editing the file directly:\n${s}`); else if (active) sendChat(`Find and fix bugs in ${rel(active)}.`); else toast('Open a file first', 'warn'); });
  C('ai.inlineEdit', 'ocode: Edit with AI (inline)…', () => aiEdit(), 'Ctrl+K', { when: hasText });
  C('ai.fixFile', 'ocode: Fix All Problems in File', aiFixFile);
  C('ai.toggleComplete', 'ocode: Toggle AI Autocomplete', () => { setSettings({ aiComplete: S.aiComplete === false }); toast(`AI autocomplete ${S.aiComplete ? 'on' : 'off'}`, 'ok', 1500); });
  C('ai.triggerComplete', 'ocode: Suggest Code Here', () => { editor.focus(); editor.trigger('ocode', 'editor.action.inlineSuggest.trigger', {}); }, 'Alt+\\', { when: hasText });
  C('ai.completeModel', 'ocode: Choose Autocomplete Model…', pickCompleteModel);
  C('ai.pullCompleteModel', 'ocode: Download Autocomplete Model', pullCompleteModel);
  C('explorer.sort', 'Explorer: Sort Files By…', async () => {
    const v = await askPick('Sort files by', Object.entries(SORTS).map(([k, [l]]) => ({ label: l, detail: k === (S.sortOrder || 'name') ? 'current' : '', value: k })));
    if (v) setSettings({ sortOrder: v });
  });
  C('view.closeSide', 'View: Close Side Panel', closeSidePanel);
  C('ai.newChat', 'ocode: New Chat', newChat);
  C('ai.compact', 'ocode: Compact Conversation', compactChat);
  C('ai.stop', 'ocode: Stop Generating', () => abortCtl?.abort());
  C('ai.effort', 'ocode: Set Effort…', async () => { const v = await askPick('Effort level', Object.entries(EFFORT_PROMPTS).map(([k, d]) => ({ label: k, detail: d, value: k }))); if (v) setSettings({ effort: v }); });
  C('ai.model', 'ocode: Switch Model…', async () => {
    await loadModels();
    const v = await askPick('Model', MODELS.map(m => ({ label: shortModel(m), detail: m === S.model ? 'current' : m.includes('/') ? m.split('/').slice(0, -1).join('/') : '', value: m })));
    if (v) setSettings({ model: v });
  });
  C('help.keys', 'Help: Keyboard Shortcuts', () => { setPanel('chat', true); slashHelp(); });
}
function cycleTab(d) { const keys = [...tabs.keys()]; if (!keys.length) return; const i = keys.indexOf(active); activate(keys[(i + d + keys.length) % keys.length]); }

async function loadModels() {
  try { MODELS = await api('/api/models'); } catch { MODELS = []; }
  if (S.model && !MODELS.includes(S.model) && MODELS.length) { /* keep user's choice; it may be pulled later */ }
}

// ── Wiring ────────────────────────────────────────────────────────────────────
function wireUI() {
  $('#logo').innerHTML = LOGO + '<span>ocode</span>';
  $('#tb-search').innerHTML = `${icon('search')}<span>Search files, run commands</span><kbd>Ctrl P</kbd>`;
  $('#tb-search').onclick = () => quickOpen();
  $('#tb-folder').onclick = () => runCommand('file.openFolder');
  $('#tb-effort').onclick = () => runCommand('ai.effort');
  $('#tb-model').onclick = () => runCommand('ai.model');
  $('#tb-sidebar').innerHTML = icon('sidebar'); $('#tb-sidebar').onclick = () => togglePanel('sidebar');
  $('#tb-term').innerHTML = icon('panelBottom'); $('#tb-term').onclick = () => togglePanel('term');
  $('#tb-chat').innerHTML = icon('panelRight'); $('#tb-chat').onclick = () => togglePanel('chat');
  const abIcons = { explorer: 'files', search: 'search', plugins: 'blocks', settings: 'sliders' };
  for (const b of $$('.ab[data-view]')) { b.innerHTML = icon(abIcons[b.dataset.view]); b.onclick = () => showView(b.dataset.view); }
  $('#ab-chat').innerHTML = icon('chat'); $('#ab-chat').onclick = () => togglePanel('chat');
  const acts = {
    newFile: ['filePlus', () => newFile()], newFolder: ['folderPlus', () => newFolder()], upFolder: ['up', () => setCwd(dirname(S.cwd))],
    refresh: ['refresh', () => { invalidateFileIndex(); refreshTree(); refreshGit(); }], collapse: ['collapse', () => { expanded.clear(); refreshTree(); }], sort: ['sort', sortMenu],
    runFile: ['play', () => runFile()], termClear: ['ban', () => term.clear()], termRestart: ['refresh', () => runCommand('terminal.new')],
    termMax: ['maximize', () => runCommand('terminal.maximize')], termHide: ['x', () => setPanel('term', false)],
    newChat: ['plus', newChat], chatHide: ['x', () => setPanel('chat', false)],
  };
  for (const b of $$('[data-act]')) { const [ic, fn] = acts[b.dataset.act]; b.innerHTML = icon(ic, ic === 'play' ? 'fill' : ''); b.onclick = fn; }
  $('#side-close').innerHTML = icon('x'); $('#side-close').onclick = closeSidePanel;
  $('#review-logo').innerHTML = LOGO;
  $('#tree').addEventListener('contextmenu', e => { if (!e.target.closest('.row')) { e.preventDefault(); treeMenu(e, null, null); } });
  $('#explorer-title').onclick = () => runCommand('file.openFolder');

  dragSplit($('#split-sidebar'), $('#sidebar'), 'x', 1, 'sidebarWidth', 170, () => innerWidth * 0.45);
  dragSplit($('#split-chat'), $('#chat'), 'x', -1, 'chatWidth', 300, () => innerWidth * 0.6);
  dragSplit($('#term-split'), $('#term-panel'), 'y', -1, 'termHeight', 90, () => innerHeight * 0.8);

  $('#search-input').addEventListener('input', runSearch);
  $('#search-input').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  for (const [id, key] of [['#search-case', 'case'], ['#search-regex', 'regex']]) $(id).onclick = () => { search[key] = !search[key]; $(id).classList.toggle('on', search[key]); runSearch(); };

  const input = $('#chat-input');
  input.addEventListener('input', () => { autosizeInput(); slashSel = 0; renderSlash(); });
  input.addEventListener('blur', () => setTimeout(() => $('#slash').classList.remove('open'), 120));
  input.addEventListener('keydown', e => {
    const open = $('#slash').classList.contains('open');
    if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const n = slashMatches(input.value).length; slashSel = (slashSel + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; renderSlash(); return; }
    if (open && (e.key === 'Tab' || e.key === 'Enter') && !e.shiftKey) { e.preventDefault(); pickSlash(slashMatches(input.value)[slashSel]); return; }
    if (open && e.key === 'Escape') { $('#slash').classList.remove('open'); return; }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = input.value; input.value = ''; autosizeInput(); sendChat(v); }
    if (e.key === 'Escape' && busy) abortCtl?.abort();
  });
  $('#send-btn').onclick = () => { if (busy) { abortCtl?.abort(); return; } const v = input.value; input.value = ''; autosizeInput(); sendChat(v); };
  $('#ci-effort').onclick = () => runCommand('ai.effort');
  $('#ci-file').onclick = () => runCommand('ai.askSelection');
  $('#messages').addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a) { e.preventDefault(); const href = a.getAttribute('href') || ''; if (/^https?:\/\//.test(href)) post('/api/open-external', { url: href }).catch(err => toast(err.message, 'error')); else if (href && !href.startsWith('#')) openFile(absPath(href.replace(/^file:\/\//, ''))); return; }
    const c = e.target.closest('code.path-link');
    if (c) { const [, p, ln] = c.textContent.trim().match(/^(.*?)(?::(\d+))?$/); openFile(absPath(p), ln ? { line: +ln } : {}); }
  });

  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
  window.addEventListener('focus', async () => {
    refreshTreeSoon(); invalidateFileIndex();
    for (const p of tabs.keys()) await reloadIfOpen(p);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  [S, INFO] = await Promise.all([api('/api/settings'), api('/api/info')]);
  await new Promise((res, rej) => { require.config({ paths: { vs: '/static/vendor/monaco/vs' } }); require(['vs/editor/editor.main'], res, rej); });
  for (const [id, t] of Object.entries(THEMES)) monaco.editor.defineTheme('t-' + id, monacoTheme(t));
  applyTheme(S.theme);
  createEditor();
  registerAiProviders();
  buildStatusbar();
  checkCompleteStatus();
  setInterval(() => { if (S.aiComplete !== false && (!AIC.status?.online || !AIC.status?.hasModel)) checkCompleteStatus(); }, 20000);
  wireUI();
  registerBuiltins();
  applyLayout();
  setBusy(false);
  renderChatEmpty();
  let start = S.cwd || INFO.home;
  try { await api('/api/files?path=' + enc(start)); } catch { start = INFO.home; }
  S.cwd = start;
  selectView('explorer');
  await initTerm();
  await setCwd(start, { noSave: true });
  await loadPlugins();
  applyTheme(S.theme);
  const restore = S.openTabs || [], restoreActive = S.activeTab;
  for (const p of restore) await openFile(p, { silent: true, noFocus: true });
  activate(restoreActive && tabs.has(restoreActive) ? restoreActive : [...tabs.keys()].pop() || null, { noFocus: true });
  loadModels().then(renderChrome);
  renderChrome();
  emit('ready');
  (editor.getModel() ? editor : $('#chat-input')).focus();
}
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:auto 20px 40px;padding:14px;background:#401a1a;color:#fbb;border-radius:8px;font:13px monospace;z-index:9999">ocode failed to start: ${esc(e.message)}</div>`); });
</script>
</body>
