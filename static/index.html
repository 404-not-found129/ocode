<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ocode</title>
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<link rel="stylesheet" data-name="vs/editor/editor.main" href="/static/vendor/monaco/vs/editor/editor.main.css">
<!-- These UMD bundles must load before Monaco's AMD loader defines `define`. -->
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/addon-fit.js"></script>
<script src="/static/vendor/marked.umd.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/monaco/vs/loader.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#121214;--bg1:#18181b;--bg2:#1f1f23;--bg3:#27272c;--bg4:#33333a;--bg5:#45454e;
  --fg0:#f2f2f4;--fg1:#cfcfd6;--fg2:#8e8e99;--fg3:#5f5f69;
  --accent:#d97757;--accent2:#eba383;--accent-dim:rgba(217,119,87,.16);--border:#26262b;
  --green:#8fbf7a;--red:#e5707a;--yellow:#e3b867;--blue:#7aa6e0;--cyan:#6cc4c9;--purple:#b99ae6;
  --font-ui:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrainsMono Nerd Font','JetBrains Mono','Fira Code',monospace;
  --r:8px;--r-sm:5px;color-scheme:dark;
}
html,body{height:100%;background:var(--bg0);color:var(--fg1);font:13px/1.45 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
kbd{font:11px var(--font-mono);color:var(--fg2);background:var(--bg3);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;white-space:nowrap}
code{font-family:var(--font-mono);font-size:.92em}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ic.fill{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg3) 35%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--fg3) 65%,transparent)}
::-webkit-scrollbar-corner{background:transparent}
body.resizing-x *{cursor:col-resize!important;user-select:none!important}
body.resizing-y *{cursor:row-resize!important;user-select:none!important}

#root{display:flex;flex-direction:column;height:100vh}

/* Titlebar */
#titlebar{height:40px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0;user-select:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;color:var(--fg0);letter-spacing:-.2px;margin-right:6px}
.logo svg{width:18px;height:18px;color:var(--accent)}
.pill{display:flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:13px;background:var(--bg2);border:1px solid var(--border);color:var(--fg2);font-size:12px;cursor:pointer;max-width:340px;white-space:nowrap}
.pill:hover{color:var(--fg0);background:var(--bg3)}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill .ic{width:14px;height:14px}
#tb-search{flex:0 1 420px;margin:0 auto;justify-content:center;max-width:none;border-radius:var(--r-sm)}
#tb-search kbd{margin-left:auto}
.spacer{flex:1}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--fg2);flex-shrink:0}
.icon-btn:hover{background:var(--bg3);color:var(--fg0)}
.icon-btn.on{color:var(--fg0)}
.icon-btn.off{color:var(--fg3)}
.icon-btn,.pill,.ab,.chip-btn,.btn,.tclose{transition:background .12s,color .12s,transform .08s}
.icon-btn:active,.pill:active,.chip-btn:active,.btn:active{transform:scale(.96)}
#tb-toggles{display:flex;align-items:center;gap:2px;padding:2px;border-radius:8px;background:var(--bg2);border:1px solid var(--border)}
#tb-toggles .icon-btn{width:26px;height:24px;border-radius:6px}
#tb-toggles .icon-btn:not(.off){background:var(--bg4);color:var(--fg0)}
.effort-ic{width:14px;height:14px}
.effort-low{color:var(--fg2)}.effort-medium{color:var(--accent)}.effort-high{color:var(--green)}.effort-max{color:var(--purple)}

#workspace{flex:1;display:flex;min-height:0}

/* Activity bar */
#activitybar{width:48px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:4px 0;flex-shrink:0}
.ab{width:48px;height:44px;display:grid;place-items:center;color:var(--fg3);position:relative}
.ab .ic{width:22px;height:22px;stroke-width:1.6}
.ab:hover{color:var(--fg1)}
.ab.active{color:var(--fg0)}
.ab.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}

/* Sidebar */
#sidebar{width:270px;background:var(--bg1);display:flex;flex-direction:column;min-width:0;flex-shrink:0}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.active{display:flex}
.view-head{height:38px;display:flex;align-items:center;gap:1px;padding:0 6px 0 16px;flex-shrink:0}
.view-title{flex:1;font-size:11px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.view-head .icon-btn{width:26px;height:26px}
.view-head .icon-btn .ic{width:15px;height:15px}
.view-body{flex:1;overflow:auto;min-height:0}
.split-x{width:4px;margin:0 -2px;position:relative;z-index:5;cursor:col-resize;flex-shrink:0}
.split-x::after{content:'';position:absolute;left:1.5px;top:0;bottom:0;width:1px;background:var(--border);transition:background .15s}
.split-x:hover::after,.split-x.dragging::after{background:var(--accent);left:1px;width:2px}
.split-y{height:4px;margin:-2px 0;position:relative;z-index:5;cursor:row-resize;flex-shrink:0}
.split-y::after{content:'';position:absolute;top:1.5px;left:0;right:0;height:1px;background:var(--border)}
.split-y:hover::after,.split-y.dragging::after{background:var(--accent);top:1px;height:2px}

/* Tree */
#tree{padding:2px 0 24px;user-select:none;min-height:100%}
.row{display:flex;align-items:center;height:24px;padding-right:10px;cursor:pointer;color:var(--fg1);white-space:nowrap;position:relative;font-size:13px}
.row:hover{background:var(--bg2)}
.row.active{background:var(--bg3);color:var(--fg0)}
.row.ctx{box-shadow:inset 0 0 0 1px var(--accent)}
.chev{width:18px;height:18px;display:grid;place-items:center;color:var(--fg3);flex-shrink:0;transition:transform .12s}
.chev .ic{width:12px;height:12px;stroke-width:2.4}
.chev.open{transform:rotate(90deg)}
.fi{width:20px;flex-shrink:0;text-align:center;font:800 8.5px/1 var(--font-mono);margin-right:6px;letter-spacing:-.4px}
.fi.folder{color:var(--accent);opacity:.85;display:grid;place-items:center}
.fi.folder .ic{width:15px;height:15px}
.row .name{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .gbadge{font:700 10px var(--font-mono);margin-left:6px;width:10px;text-align:center}
.row.g-M .name,.row.g-M .gbadge{color:var(--yellow)}
.row.g-U .name,.row.g-U .gbadge,.row.g-A .name,.row.g-A .gbadge{color:var(--green)}
.row.g-D .name,.row.g-D .gbadge{color:var(--red)}
.row.g-R .name,.row.g-R .gbadge{color:var(--cyan)}
.row.dir.g-M .gbadge,.row.dir.g-U .gbadge,.row.dir.g-A .gbadge{font-size:14px;line-height:1}
.tree-msg{padding:10px 16px;color:var(--fg3);font-size:12px}

/* Center */
#center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg0)}
#tabbar{height:38px;display:flex;background:var(--bg1);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;flex-shrink:0}
#tabbar::-webkit-scrollbar{height:3px}
#tabbar::-webkit-scrollbar-thumb{border:0}
.tab{display:flex;align-items:center;gap:7px;padding:0 6px 0 12px;max-width:240px;border-right:1px solid var(--border);color:var(--fg2);cursor:pointer;flex-shrink:0;font-size:12.5px;position:relative;user-select:none}
.tab:hover{background:var(--bg2);color:var(--fg1)}
.tab.active{background:var(--bg0);color:var(--fg0)}
.tab.active::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--bg0)}
.tab .fi{margin-right:0;width:auto;min-width:14px}
.tab .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tdir{color:var(--fg3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.tclose{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--fg3);flex-shrink:0}
.tclose .ic{width:13px;height:13px;stroke-width:2.2}
.tclose:hover{background:var(--bg4);color:var(--fg0)}
.tclose .dirty{width:8px;height:8px;border-radius:50%;background:var(--fg1);display:none}
.tab.dirty .tclose .dirty{display:block}
.tab.dirty .tclose .ic{display:none}
.tab.dirty .tclose:hover .dirty{display:none}
.tab.dirty .tclose:hover .ic{display:block}
.tab:not(:hover):not(.active):not(.dirty) .tclose{visibility:hidden}
#crumbs{height:26px;display:flex;align-items:center;gap:3px;padding:0 16px;font-size:12px;color:var(--fg3);flex-shrink:0;white-space:nowrap;overflow:hidden;user-select:none}
#crumbs .ic{width:12px;height:12px;stroke-width:2}
#crumbs .crumb:last-child{color:var(--fg1)}
#crumbs:empty{display:none}
#editor-wrap{flex:1;position:relative;min-height:0}
#monaco,#welcome,#image-view{position:absolute;inset:0}
#image-view{display:none;place-items:center;overflow:auto;background:repeating-conic-gradient(var(--bg1) 0 25%,var(--bg0) 0 50%) 0 0/20px 20px}
#image-view img{max-width:92%;max-height:92%;box-shadow:0 8px 40px rgba(0,0,0,.4);image-rendering:auto}
#image-view .meta{position:absolute;bottom:12px;right:16px;font-size:11px;color:var(--fg2);background:var(--bg1);padding:3px 8px;border-radius:4px}

/* Welcome */
#welcome{display:flex;align-items:center;justify-content:center;overflow:auto;padding:40px}
.wl{width:min(640px,100%)}
.wl-head{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.wl-head svg{width:52px;height:52px;color:var(--accent)}
.wl-title{font-size:30px;font-weight:650;color:var(--fg0);letter-spacing:-.6px}
.wl-sub{color:var(--fg2);font-size:13.5px}
.wl-cols{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.wl h3{font-size:11px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--fg3);margin-bottom:10px}
.wl-item{display:flex;align-items:center;gap:10px;padding:5px 8px;margin:0 -8px;border-radius:var(--r-sm);color:var(--fg1);cursor:pointer;font-size:13px;min-width:0}
.wl-item:hover{background:var(--bg2);color:var(--fg0)}
.wl-item .ic{color:var(--accent)}
.wl-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-item small{color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto;padding-left:8px}
.wl-item kbd{margin-left:auto}
.wl-empty{color:var(--fg3);font-size:12.5px}

/* Terminal */
#term-panel{height:260px;min-height:90px;display:flex;flex-direction:column;background:var(--bg1);flex-shrink:0}
#term-head{height:36px;display:flex;align-items:center;gap:2px;padding:0 6px 0 16px;flex-shrink:0;user-select:none}
#term-head .view-title{flex:0 0 auto;color:var(--fg1)}
#term-head .tsub{color:var(--fg3);font-size:11.5px;margin-left:10px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:var(--font-mono)}
#term-head .icon-btn .ic{width:15px;height:15px}
#xterm{flex:1;min-height:0;padding:2px 0 4px 14px}
#xterm .xterm-viewport{background:transparent!important}
#center.term-max>#tabbar,#center.term-max>#crumbs,#center.term-max>#editor-wrap,#center.term-max>#term-split{display:none}
#center.term-max>#term-panel{flex:1;height:auto!important}

/* Chat */
#chat{width:410px;min-width:300px;display:flex;flex-direction:column;background:var(--bg1);flex-shrink:0}
#chat-head{height:40px;display:flex;align-items:center;gap:2px;padding:0 6px 0 16px;flex-shrink:0;border-bottom:1px solid var(--border)}
#chat-head .ch-title{flex:1;font-weight:600;color:var(--fg0);font-size:13px}
#messages{flex:1;overflow-y:auto;padding:16px 16px 8px;user-select:text}
.chat-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;user-select:none}
.chat-empty svg{width:40px;height:40px;color:var(--accent);margin-bottom:6px}
.ce-title{font-size:19px;font-weight:600;color:var(--fg0);letter-spacing:-.3px}
.ce-sub{color:var(--fg2);font-size:12.5px;max-width:280px}
.ce-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.ce-recent{margin-top:18px;width:100%;max-width:300px;text-align:left}
.ce-recent-title{font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--fg3);margin:0 0 4px 8px}
.ce-recent button{display:flex;width:100%;gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--fg1);text-align:left}
.ce-recent button:hover{background:var(--bg2);color:var(--fg0)}
.ce-recent button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ce-recent button span:last-child{color:var(--fg3);font-size:11px;flex-shrink:0}
.approve{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--fg2)}
.approve .btn{height:24px;padding:0 10px;font-size:12px}
.approve .allow{background:var(--accent);color:#fff;border-color:transparent}
.m-user .bubble .mention,.md .mention{color:var(--accent2);font-family:var(--font-mono);font-size:.92em}
.chip{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--bg2);color:var(--fg1);font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--fg0)}
.m-user{display:flex;justify-content:flex-end;margin:4px 0 18px}
.m-user .bubble{background:var(--bg3);color:var(--fg0);border-radius:14px 14px 4px 14px;padding:8px 13px;max-width:90%;word-break:break-word}
.m-ai{margin:0 0 20px}
.m-ai-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.m-ai-head svg{width:16px;height:16px;color:var(--accent)}
.m-ai-head span{font-weight:600;color:var(--fg0);font-size:12.5px}
.m-ai-body{color:var(--fg1);word-break:break-word}
.m-ai-head .m-actions{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.m-ai:hover .m-actions{opacity:1}
.m-actions button{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--fg3)}
.m-actions button:hover{background:var(--bg3);color:var(--fg0)}
.m-actions .ic{width:13px;height:13px}
.m-stats{font-size:11px;color:var(--fg3);margin-top:4px;font-variant-numeric:tabular-nums}
.m-think{font-size:12px;color:var(--fg3);border-left:2px solid var(--border);padding:2px 0 2px 10px;margin:4px 0 8px;white-space:pre-wrap;max-height:160px;overflow:auto}
.m-think:empty{display:none}
.m-live{white-space:normal}
.m-live::after{content:'▍';color:var(--accent);animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.chat-error{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:var(--r-sm);padding:6px 10px;margin:6px 0;font-size:12.5px}
.chat-note{color:var(--fg3);font-size:12px;margin:6px 0}
.dots{display:flex;gap:4px;padding:6px 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.55);opacity:.35}40%{transform:scale(1);opacity:1}}
.sys{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;margin:6px 0 12px;border-radius:var(--r-sm);background:var(--bg2);border-left:2px solid var(--accent);font-size:12.5px;color:var(--fg1)}
.sys code{color:var(--accent2)}

/* Markdown */
.md>*:first-child{margin-top:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table,.md .codeblock{margin:8px 0}
.md ul,.md ol{padding-left:20px}
.md li{margin:2px 0}
.md h1,.md h2,.md h3,.md h4{color:var(--fg0);margin:14px 0 6px;font-weight:620;line-height:1.3}
.md h1{font-size:17px}.md h2{font-size:15.5px}.md h3,.md h4{font-size:14px}
.md a{color:var(--accent2);text-decoration:none}.md a:hover{text-decoration:underline}
.md :not(pre)>code{background:var(--bg3);padding:1px 5px;border-radius:4px;color:var(--fg0)}
.md code.path-link{cursor:pointer;color:var(--accent2)}
.md code.path-link:hover{text-decoration:underline}
.md blockquote{border-left:3px solid var(--bg5);padding-left:10px;color:var(--fg2)}
.md table{border-collapse:collapse;font-size:12.5px}
.md th,.md td{border:1px solid var(--border);padding:4px 8px}
.md hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.codeblock{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--bg0)}
.cb-head{display:flex;align-items:center;gap:2px;padding:3px 4px 3px 12px;background:var(--bg2);font:11px var(--font-mono);color:var(--fg2)}
.cb-head span{flex:1}
.cb-head button{display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:4px;font:11px var(--font-ui);color:var(--fg2)}
.cb-head button:hover{background:var(--bg4);color:var(--fg0)}
.cb-head .ic{width:13px;height:13px}
.codeblock pre{margin:0;padding:10px 12px;overflow-x:auto;font:12.5px/1.5 var(--font-mono);background:transparent}

/* Tool blocks */
.tool{border:1px solid var(--border);border-radius:var(--r);margin:8px 0;overflow:hidden;background:var(--bg0)}
.tool-head{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;user-select:none}
.tool-head:hover{background:var(--bg2)}
.tool-head>.ic{width:14px;height:14px;color:var(--fg2)}
.tool-verb{font-weight:600;color:var(--fg0)}
.tool-target{color:var(--fg2);font-family:var(--font-mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tool-target.link{color:var(--accent2);cursor:pointer}
.tool-target.link:hover{text-decoration:underline}
.tool-status{font-size:11px;flex-shrink:0}
.tool-status.running{width:12px;height:12px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.tool-status.ok{color:var(--green)}.tool-status.err{color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
.tool-chev{width:12px!important;height:12px!important;transition:transform .12s;color:var(--fg3)!important}
.tool.open .tool-chev{transform:rotate(90deg)}
.tool-body{display:none;border-top:1px solid var(--border)}
.tool.open .tool-body{display:block}
.tool-body pre{margin:0;padding:8px 12px;font:11.5px/1.5 var(--font-mono);color:var(--fg1);max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.tool-body pre+pre{border-top:1px solid var(--border)}
.tool-result{color:var(--fg2)!important}
.tool-result.err{color:var(--red)!important}
.diff .del{color:var(--red);background:color-mix(in srgb,var(--red) 9%,transparent)}
.diff .add{color:var(--green);background:color-mix(in srgb,var(--green) 9%,transparent)}

/* Chat input */
#input-area{padding:10px 12px 12px;position:relative;flex-shrink:0}
#input-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;transition:border-color .15s,box-shadow .15s}
#input-box:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));box-shadow:0 0 0 3px var(--accent-dim)}
#chat-input{display:block;width:100%;background:none;border:none;outline:none;resize:none;padding:11px 14px 4px;color:var(--fg0);min-height:46px;max-height:240px;line-height:1.5}
#chat-input::placeholder{color:var(--fg3)}
.input-row{display:flex;align-items:center;gap:2px;padding:2px 6px 6px 6px;min-width:0}
.input-row .spacer{min-width:4px}
.chip-btn{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:7px;font-size:12px;color:var(--fg2);white-space:nowrap;min-width:0;max-width:170px}
.chip-btn:hover,.chip-btn.open{background:var(--bg3);color:var(--fg0)}
.chip-btn>span{overflow:hidden;text-overflow:ellipsis}
.chip-btn .ic{width:14px;height:14px}
.chip-btn .caret{width:11px;height:11px;stroke-width:2.4;transform:rotate(90deg);opacity:.6;flex-shrink:0}
.chip-btn.off span{text-decoration:line-through;opacity:.6}
.chip-btn .fi{margin:0;width:auto;min-width:14px}
#ci-effort{flex-shrink:0}
#ci-model{flex-shrink:1;min-width:64px;max-width:140px}
#ci-file{flex-shrink:3;min-width:34px}
#ci-mode{flex-shrink:0;padding:0 6px}
#ci-mode.on{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
#ci-mode.on:hover{background:color-mix(in srgb,var(--red) 20%,transparent)}
#input-box.unrestricted{border-color:color-mix(in srgb,var(--red) 45%,var(--border))}
#input-box.unrestricted:focus-within{border-color:color-mix(in srgb,var(--red) 70%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 14%,transparent)}
.input-hint{font-size:11px;color:var(--fg3);padding:6px 4px 0;display:flex;gap:12px;justify-content:center}
.input-hint b{font-weight:600;color:var(--fg2)}
#send-btn{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:opacity .15s,background .15s}
#send-btn .ic{width:16px;height:16px;stroke-width:2.4}
#send-btn:hover{background:var(--accent2)}
#send-btn.busy{background:var(--fg1);color:var(--bg0)}
#send-btn .ic.fill{width:11px;height:11px}
#slash{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);background:var(--bg1);border:1px solid var(--bg4);border-radius:var(--r);box-shadow:0 -10px 40px rgba(0,0,0,.35);overflow:hidden;display:none;z-index:50;max-height:320px;overflow-y:auto}
#slash.open{display:block}
.sl-item{display:flex;align-items:baseline;gap:8px;padding:7px 12px;cursor:pointer;font-size:12.5px}
.sl-item.sel{background:var(--bg3)}
.sl-name{color:var(--accent2);font-family:var(--font-mono);font-weight:600}
.sl-args{color:var(--fg3);font-family:var(--font-mono);font-size:11px}
.sl-desc{color:var(--fg2);margin-left:auto;text-align:right;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sl-item .fi{flex-shrink:0}

/* Status bar */
#statusbar{height:24px;display:flex;align-items:stretch;background:var(--bg1);border-top:1px solid var(--border);font-size:12px;color:var(--fg2);flex-shrink:0;user-select:none;padding:0 4px}
#statusbar .grp{display:flex;align-items:stretch;min-width:0}
.sb-item{display:flex;align-items:center;gap:5px;padding:0 8px;white-space:nowrap;cursor:pointer;border-radius:3px}
.sb-item:hover{background:var(--bg3);color:var(--fg0)}
.sb-item.static{cursor:default}.sb-item.static:hover{background:none;color:inherit}
.sb-item .ic{width:13px;height:13px}
.sb-item:empty{display:none}
.sb-err{color:var(--red)}.sb-warn{color:var(--yellow)}

/* Quick open */
#quick-back{position:fixed;inset:0;z-index:1000;display:none;background:rgba(0,0,0,.18)}
#quick-back.open{display:block}
#quick-back.anchored{background:transparent}
#quick{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));background:var(--bg1);border:1px solid var(--bg4);border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.5);overflow:hidden;animation:popin .12s ease-out}
#quick.anchored{transform:none;max-height:calc(100vh - 16px);display:flex;flex-direction:column}
.qi .qcheck{color:var(--accent);margin-left:auto;font-weight:700}
#quick-title{font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--fg3);padding:10px 14px 0}
#quick-title:empty{display:none}
#quick-input{width:100%;background:var(--bg2);border:1px solid var(--border);outline:none;border-radius:var(--r-sm);padding:8px 12px;margin:8px 0 0;color:var(--fg0);font-size:13.5px}
#quick-input:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.q-in{padding:0 8px 8px}
#quick-list{max-height:min(440px,60vh);overflow-y:auto;padding:0 6px 6px}
#quick-list:empty{display:none}
.qi{display:flex;align-items:center;gap:9px;padding:0 10px;height:30px;border-radius:var(--r-sm);cursor:pointer;color:var(--fg1);font-size:13px}
.qi.sel{background:var(--bg3);color:var(--fg0)}
.qi .fi{margin-right:0}
.qi>.ic{color:var(--fg2)}
.qi .ql{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .ql b{color:var(--accent2);font-weight:650}
.qi .qd{color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.qi kbd{margin-left:auto}
.q-sep{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);padding:8px 10px 3px;font-weight:650}

/* Context menu */
#ctxmenu{position:fixed;z-index:1100;min-width:220px;background:var(--bg1);border:1px solid var(--bg4);border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.45);padding:5px;display:none;font-size:12.5px;animation:popin .1s ease-out}
.mi{display:flex;align-items:center;gap:20px;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--fg1)}
.mi:hover{background:var(--bg3);color:var(--fg0)}
.mi span{flex:1}
.mi.danger{color:var(--red)}.mi.danger:hover{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}

/* Popover menus anchored to the button that opened them */
@keyframes popin{from{opacity:0;transform:translateY(var(--pop-dy,-4px)) scale(.98)}}
#popover{position:fixed;z-index:1150;display:none;flex-direction:column;background:var(--bg1);border:1px solid var(--bg4);border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,.5);overflow:hidden;font-size:13px;outline:none}
#popover.open{display:flex;animation:popin .12s ease-out}
#popover[data-side=above]{--pop-dy:4px}
.pop-title{padding:10px 14px 4px;font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--fg3)}
.pop-search-wrap{padding:6px 8px 4px}
.pop-search{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;outline:none;color:var(--fg0);font-size:12.5px}
.pop-search:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.pop-list{overflow-y:auto;padding:4px 5px 5px;min-height:0}
.pi{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--fg1);min-width:0}
.pi.sel{background:var(--bg3);color:var(--fg0)}
.pi.disabled{opacity:.45;cursor:default}
.pi.danger{color:var(--red)}
.pi-ic{width:18px;display:grid;place-items:center;flex-shrink:0;color:var(--fg2)}
.pi-ic .ic{width:16px;height:16px}
.pi-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pi-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-label b{color:var(--accent2);font-weight:650}
.pi-desc{font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi.sel .pi-desc{color:var(--fg2)}
.pi-right{font-size:11px;color:var(--fg3);white-space:nowrap}
.pi-check{width:14px;color:var(--accent);font-weight:700;flex-shrink:0;text-align:center}
.pop-sep{height:1px;background:var(--border);margin:4px 6px}
.pop-head{font-size:10.5px;font-weight:650;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);padding:8px 9px 3px}
.pop-note{display:flex;align-items:center;gap:8px;margin:2px 4px 4px;padding:7px 9px;border-radius:7px;background:var(--bg2);font-size:12px;color:var(--fg2)}
.pop-note .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--fg3)}
.pop-note.ok .dot{background:var(--green)}.pop-note.warn .dot{background:var(--yellow)}
.pop-foot{padding:7px 14px 9px;border-top:1px solid var(--border);font-size:11.5px;color:var(--fg3)}
.pop-empty{padding:10px 12px;color:var(--fg3);font-size:12px}

/* Explorer indent guides */
.row .guide{position:absolute;top:0;bottom:0;width:1px;background:transparent;transition:background .15s}
#tree:hover .row .guide{background:var(--border)}
.msep{height:1px;background:var(--border);margin:4px 6px}

/* Toasts */
#toasts{position:fixed;right:16px;bottom:36px;display:flex;flex-direction:column;gap:8px;z-index:1200;pointer-events:none}
.toast{pointer-events:auto;min-width:240px;max-width:420px;background:var(--bg2);border:1px solid var(--bg4);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:9px 12px;color:var(--fg1);font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:tin .18s ease-out}
.toast.error{border-left-color:var(--red)}.toast.warn{border-left-color:var(--yellow)}.toast.ok{border-left-color:var(--green)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* Search view */
.search-box{padding:2px 12px 8px;display:flex;flex-direction:column;gap:6px}
.sinput{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding-right:3px}
.sinput:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.sinput input{flex:1;min-width:0;background:none;border:none;outline:none;padding:6px 9px;color:var(--fg0)}
.tog{width:24px;height:22px;border-radius:4px;font:600 11.5px var(--font-mono);color:var(--fg3)}
.tog:hover{color:var(--fg1);background:var(--bg3)}
.tog.on{color:var(--fg0);background:var(--accent-dim);box-shadow:inset 0 0 0 1px var(--accent)}
#search-summary{font-size:11.5px;color:var(--fg3);padding:0 2px}
.sr-file{display:flex;align-items:center;gap:4px;height:24px;padding:0 10px 0 4px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.sr-file:hover{background:var(--bg2)}
.sr-file .fi{margin-right:2px}
.sr-file .sdir{color:var(--fg3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;margin-left:4px}
.sr-count{background:var(--bg3);color:var(--fg2);border-radius:9px;padding:0 6px;font-size:10.5px}
.sr-line{height:22px;line-height:22px;padding:0 10px 0 44px;cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.sr-line:hover{background:var(--bg2);color:var(--fg1)}
.sr-line mark{background:color-mix(in srgb,var(--yellow) 30%,transparent);color:var(--fg0);border-radius:2px}
.sr-group.closed .sr-line{display:none}
.sr-group.closed .chev{transform:none}

/* Settings / plugins views */
.set-group{font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);padding:16px 16px 6px}
.set-row{padding:6px 16px;display:flex;flex-direction:column;gap:5px}
.set-row.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.set-label{font-size:12.5px;color:var(--fg1)}
.set-label small{display:block;color:var(--fg3);font-size:11.5px}
.set-row input[type=text],.set-row input[type=number],.set-row select{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;outline:none;color:var(--fg0);width:100%}
.set-row input:focus,.set-row select:focus{border-color:var(--accent)}
.set-row select option{background:var(--bg1)}
.switch{position:relative;width:32px;height:18px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--bg4);border-radius:9px;transition:background .15s}
.switch span::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--fg1);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(14px);background:#fff}
.btn{padding:5px 12px;border-radius:var(--r-sm);background:var(--bg3);border:1px solid var(--border);color:var(--fg1);font-size:12.5px}
.btn:hover{background:var(--bg4);color:var(--fg0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.set-actions,.plug-actions{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px}
.plug{margin:0 12px 8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg0)}
.plug-top{display:flex;align-items:center;gap:8px}
.plug-name{font-weight:600;color:var(--fg0);flex:1;overflow:hidden;text-overflow:ellipsis}
.plug-status{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg3)}
.plug.loaded .plug-status{color:var(--green)}.plug.error .plug-status{color:var(--red)}
.plug-err{color:var(--red);font:11.5px var(--font-mono);margin-top:6px;word-break:break-word}
.plug-links{margin-top:6px;font-size:12px}
.plug-links a{color:var(--accent2);text-decoration:none;cursor:pointer}
.plug-links a:hover{text-decoration:underline}
.plug-links .dot-sep{color:var(--fg3);margin:0 6px}
.plug-name.link{cursor:pointer}
.plug-name.link:hover{color:var(--accent2)}
.plug-desc{color:var(--fg2);font-size:12px;line-height:1.45;margin-top:4px}
.readme-bar{display:flex;gap:6px;padding:12px 26px 0}
.readme-view{padding:10px 26px 48px;max-width:860px;font-size:13.5px;line-height:1.6;color:var(--fg1);user-select:text}
.readme-view h1{font-size:22px;margin:10px 0 8px}
.readme-view h2{font-size:17px;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.readme-view h3{font-size:14.5px;margin:16px 0 6px}
.readme-view table{display:block;overflow-x:auto;max-width:100%}
.readme-view th{background:var(--bg2);text-align:left}
.empty{color:var(--fg3);padding:4px 16px 12px;font-size:12.5px}
.api-doc{margin:8px 12px 20px;font-size:12px;color:var(--fg2)}
.api-doc summary{cursor:pointer;color:var(--fg1);padding:4px 0}
.api-doc pre{font:11.5px/1.55 var(--font-mono);background:var(--bg0);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;overflow-x:auto;margin-top:6px;color:var(--fg1);user-select:text}

/* AI status, progress, review */
.sb-ai .ic{width:13px;height:13px}
.sb-ai.on{color:var(--accent2)}
.sb-ai.off{color:var(--fg3)}
.sb-ai.warn{color:var(--yellow)}
.sb-ai.busy .ic{animation:spin 1.1s linear infinite;color:var(--accent)}
#ai-progress{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-radius:18px;background:var(--bg2);border:1px solid var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:12.5px;color:var(--fg1);white-space:nowrap}
#ai-progress.open{display:flex}
#ai-progress .ic{width:14px;height:14px;color:var(--accent);animation:spin 1.1s linear infinite}
#ai-progress small{color:var(--fg3)}
#ai-progress button{padding:2px 9px;border-radius:10px;background:var(--bg4);font-size:11.5px}
#ai-progress button:hover{background:var(--red);color:#fff}
#review,#multi{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#review.open,#multi.open{display:flex}
#multi .rv{width:min(1440px,calc(100vw - 40px));height:calc(100vh - 56px)}
.mv-body{flex:1;display:flex;min-height:0}
.mv-files{width:280px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:6px}
.mv-main{flex:1;display:flex;flex-direction:column;min-width:0}
.mv-why{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--fg2);background:var(--bg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-why.err{color:var(--red)}
#multi-diff{flex:1;min-height:0}
.mf{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--fg1)}
.mf:hover{background:var(--bg2)}
.mf.sel{background:var(--bg3);color:var(--fg0)}
.mf input{accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.mf .fi{margin:0}
.mf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.mf-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.mf-dir{font-size:11px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf-badge{font:600 10.5px var(--font-mono);color:var(--fg3);white-space:nowrap;display:flex;align-items:center;gap:5px}
.mf-badge .add{color:var(--green)}.mf-badge .del{color:var(--red)}
.mf.pending{opacity:.55}
.mf.failed .mf-name{color:var(--red)}
.mf.nochange .mf-name{color:var(--fg3)}
.mf.delete .mf-name{text-decoration:line-through}
@media (max-width: 860px) {
  #review .rv,#multi .rv{width:calc(100vw - 16px);height:calc(100vh - 16px)}
  .rv-head{flex-wrap:wrap;row-gap:6px}
  .rv-sub{order:5;width:100%}
  .mv-body{flex-direction:column}
  .mv-files{width:auto;max-height:34%;border-right:none;border-bottom:1px solid var(--border)}
}
.spin{width:11px;height:11px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.mv-status{display:flex;align-items:center;gap:8px}
.toast{display:flex;align-items:center;gap:10px}
.toast>span{flex:1}
.toast-btn{padding:3px 10px;border-radius:5px;background:var(--bg4);color:var(--fg0);font-size:12px;font-weight:600}
.toast-btn:hover{background:var(--accent);color:#fff}
.rv{width:min(1200px,calc(100vw - 48px));height:min(760px,calc(100vh - 80px));display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--bg4);border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.rv-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border)}
.rv-head svg{width:18px;height:18px;color:var(--accent)}
.rv-title{flex:1;min-width:0;font-weight:600;color:var(--fg0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-sub{font-size:11.5px;color:var(--fg3);white-space:nowrap}
#review-diff{flex:1;min-height:0}
.btn kbd{margin-left:6px;background:transparent;color:inherit;opacity:.7;border-color:currentColor}
/* Side panel (plugins) */
#side-view{position:absolute;top:0;right:0;bottom:0;width:var(--side-w,48%);display:none;flex-direction:column;border-left:1px solid var(--border);background:var(--bg0)}
#editor-wrap.has-side #side-view{display:flex}
#editor-wrap.has-side #monaco,#editor-wrap.has-side #welcome,#editor-wrap.has-side #image-view{right:var(--side-w,48%)}
.sv-head{height:32px;display:flex;align-items:center;padding:0 6px 0 14px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.sv-title{flex:1;font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-body{flex:1;overflow:auto;min-height:0}
.mi .mcheck{width:14px;color:var(--accent);flex:0 0 14px;margin-right:-12px}
.ai-editing{background:var(--accent-dim)}

/* Diff tabs */
#diffview{position:absolute;inset:0;display:none;flex-direction:column}
#editor-wrap.has-side #diffview{right:var(--side-w,48%)}
.dv-bar{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0;font-size:12.5px}
.dv-title{flex:1;min-width:0;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-title b{color:var(--fg0);font-weight:600}
.dv-actions{display:flex;gap:6px}
.dv-actions .btn{padding:3px 10px;font-size:12px}
#dv-editor{flex:1;min-height:0}

/* Bottom panel tabs + Problems */
.ptab{align-self:stretch;padding:0 2px;margin-right:14px;font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--fg3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.ptab:hover{color:var(--fg1)}
.ptab.active{color:var(--fg0);border-bottom-color:var(--accent)}
.pcount{background:var(--bg4);color:var(--fg1);border-radius:9px;padding:0 6px;font-size:10px;letter-spacing:0;line-height:16px}
.pcount:empty{display:none}
.term-only{display:flex;align-items:center;gap:2px}
#term-panel.problems .term-only{display:none}
#term-panel.problems #term-sub{visibility:hidden}
#problems-view{flex:1;min-height:0;overflow:auto;display:none;padding:2px 0 8px}
#term-panel.problems #xterm{display:none}
#term-panel.problems #problems-view{display:block}
.pr-file{display:flex;align-items:center;gap:6px;height:24px;padding:0 14px;font-size:12.5px;cursor:pointer;color:var(--fg1)}
.pr-file .sdir{color:var(--fg3);font-size:11.5px}
.pr-file .cnt{background:var(--bg3);color:var(--fg2);border-radius:9px;padding:0 6px;font-size:10.5px}
.pr-row{display:flex;align-items:center;gap:8px;height:22px;padding:0 14px 0 36px;font-size:12px;cursor:pointer;color:var(--fg1);white-space:nowrap}
.pr-row:hover,.pr-file:hover{background:var(--bg2)}
.pr-row .ic{width:13px;height:13px}
.pr-row .msg{overflow:hidden;text-overflow:ellipsis}
.pr-row .src{color:var(--fg3);font-size:11px;flex-shrink:0}
.pr-empty{padding:12px 16px;color:var(--fg3);font-size:12.5px}

/* Activity bar badge */
.ab-badge{position:absolute;right:6px;bottom:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font:700 9.5px/16px var(--font-ui);text-align:center}
.ab-badge:empty{display:none}

/* Source control */
.scm-branch{display:flex;align-items:center;gap:6px;padding:2px 12px 10px 14px;font-size:12.5px;color:var(--fg1)}
.scm-branch .bname{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0;padding:3px 6px;margin-left:-6px;border-radius:6px}
.scm-branch .bname:hover{background:var(--bg2)}
.scm-branch .bname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scm-branch .ic{width:14px;height:14px;color:var(--accent)}
.scm-sync{margin-left:auto;display:flex;align-items:center;gap:5px;font:600 11px var(--font-mono);color:var(--fg2);padding:3px 8px;border-radius:6px;background:var(--bg2);cursor:pointer;flex-shrink:0}
.scm-sync:hover{background:var(--bg3);color:var(--fg0)}
.scm-sync .ic{width:13px;height:13px;color:inherit}
.scm-commit{padding:0 12px 10px;display:flex;flex-direction:column;gap:6px}
.scm-msg{position:relative}
.scm-msg textarea{display:block;width:100%;min-height:58px;max-height:180px;resize:vertical;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:7px 32px 7px 9px;color:var(--fg0);outline:none;font:12.5px/1.45 var(--font-ui)}
.scm-msg textarea:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.scm-msg .gen{position:absolute;right:5px;top:5px}
.scm-btns{display:flex;gap:4px}
.scm-btns .btn.primary{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.scm-btns .btn .ic{width:14px;height:14px}
.scm-btns .caret{transform:rotate(90deg)}
.mini{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--fg2);flex-shrink:0}
.mini:hover{background:var(--bg4);color:var(--fg0)}
.mini .ic{width:14px;height:14px}
.mini.busy .ic{animation:spin .9s linear infinite}
.scm-group{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 4px;font-size:11px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--fg2);cursor:pointer;user-select:none}
.scm-group:hover{color:var(--fg1)}
.scm-group .cnt{background:var(--bg3);color:var(--fg1);border-radius:9px;padding:0 6px;font-size:10.5px;letter-spacing:0}
.scm-group .acts,.scm-file .acts{margin-left:auto;display:none;gap:1px}
.scm-group:hover .acts,.scm-file:hover .acts{display:flex}
.scm-sec.closed .scm-file{display:none}
.scm-sec.closed .chev{transform:none}
.scm-file{display:flex;align-items:center;gap:4px;height:24px;padding:0 6px 0 22px;cursor:pointer;font-size:12.5px;color:var(--fg1);white-space:nowrap}
.scm-file:hover{background:var(--bg2)}
.scm-file.sel{background:var(--bg3)}
.scm-file .fi{margin-right:2px}
.scm-file .name{overflow:hidden;text-overflow:ellipsis;flex-shrink:0;max-width:60%}
.scm-file .sdir{color:var(--fg3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;margin-left:4px}
.scm-file .st{font:700 11px var(--font-mono);width:16px;text-align:center;flex-shrink:0}
.st-M{color:var(--yellow)}.st-A,.st-U{color:var(--green)}.st-D{color:var(--red)}.st-R{color:var(--cyan)}.st-C{color:var(--red)}
.scm-empty{padding:6px 14px 12px;color:var(--fg3);font-size:12.5px;line-height:1.55}
.scm-empty .btn{margin-top:10px}

/* Outline */
#outline-body{padding:2px 0 20px}
.ol-row{display:flex;align-items:center;gap:6px;height:24px;padding-right:10px;cursor:pointer;font-size:12.5px;color:var(--fg1);white-space:nowrap}
.ol-row:hover{background:var(--bg2)}
.ol-row.cur{background:var(--bg3);color:var(--fg0)}
.ol-kind{width:16px;text-align:center;font:800 10px var(--font-mono);flex-shrink:0}
.ok-class{color:var(--purple)}.ok-function{color:var(--yellow)}.ok-method{color:var(--blue)}.ok-heading{color:var(--cyan)}
.ok-variable{color:var(--accent2)}.ok-type{color:var(--green)}.ok-module{color:var(--fg2)}.ok-key{color:var(--blue)}
.ol-name{overflow:hidden;text-overflow:ellipsis}
.ol-line{margin-left:auto;color:var(--fg3);font-size:11px;font-family:var(--font-mono);padding-left:8px}

/* Git gutter markers and inline blame */
.gd-add,.gd-mod{width:3px!important;margin-left:5px;border-radius:1px}
.gd-add{background:var(--green)}
.gd-mod{background:var(--blue)}
.gd-del{width:7px!important;height:7px!important;margin-left:4px;background:linear-gradient(to bottom right,var(--red) 50%,transparent 50%)}
[class*="gb-msg-"]::after{margin-left:3em;color:var(--fg3);font-style:italic;white-space:pre;pointer-events:none;opacity:.85}
.crumb.sym{color:var(--fg2)}
.crumb.sym .ol-kind{display:inline-block;width:auto}
.scm-sync.busy{opacity:.5;pointer-events:none}
.icon-btn.busy .ic{animation:spin .9s linear infinite}

/* Monaco polish */
.monaco-editor .margin,.monaco-editor-background{transition:background-color .2s}
.monaco-editor .suggest-widget,.monaco-editor .monaco-hover{border-radius:var(--r-sm)!important;overflow:hidden}
</style>
</head>
<body>
<div id="root">
  <div id="titlebar">
    <div class="logo" id="logo"></div>
    <div class="pill" id="tb-folder" title="Open folder (Ctrl+O)"></div>
    <div class="pill" id="tb-search" title="Go to file (Ctrl+P)"></div>
    <div id="tb-toggles">
      <button class="icon-btn" id="tb-sidebar" title="Toggle sidebar (Ctrl+B)"></button>
      <button class="icon-btn" id="tb-term" title="Toggle terminal (Ctrl+`)"></button>
      <button class="icon-btn" id="tb-chat" title="Toggle chat (Ctrl+Alt+B)"></button>
    </div>
  </div>

  <div id="workspace">
    <nav id="activitybar">
      <button class="ab" data-view="explorer" title="Explorer (Ctrl+Shift+E)"></button>
      <button class="ab" data-view="search" title="Search (Ctrl+Shift+F)"></button>
      <button class="ab" data-view="scm" title="Source Control (Ctrl+Shift+G)"><span class="ab-badge" id="scm-badge"></span></button>
      <button class="ab" data-view="outline" title="Outline"></button>
      <button class="ab" data-view="plugins" title="Plugins (Ctrl+Shift+X)"></button>
      <div class="spacer"></div>
      <button class="ab" id="ab-chat" title="Chat (Ctrl+L)"></button>
      <button class="ab" data-view="settings" title="Settings (Ctrl+,)"></button>
    </nav>

    <aside id="sidebar">
      <section class="view" id="view-explorer">
        <div class="view-head">
          <span class="view-title" id="explorer-title">Explorer</span>
          <button class="icon-btn" data-act="newFile" title="New file"></button>
          <button class="icon-btn" data-act="newFolder" title="New folder"></button>
          <button class="icon-btn" data-act="upFolder" title="Parent folder"></button>
          <button class="icon-btn" data-act="sort" title="Sort files"></button>
          <button class="icon-btn" data-act="refresh" title="Refresh"></button>
          <button class="icon-btn" data-act="collapse" title="Collapse all"></button>
        </div>
        <div class="view-body"><div id="tree"></div></div>
      </section>
      <section class="view" id="view-search">
        <div class="view-head"><span class="view-title">Search</span></div>
        <div class="search-box">
          <div class="sinput">
            <input id="search-input" placeholder="Search in folder" spellcheck="false">
            <button class="tog" id="search-case" title="Match case">Aa</button>
            <button class="tog" id="search-regex" title="Regular expression">.*</button>
          </div>
          <div id="search-summary"></div>
        </div>
        <div class="view-body" id="search-results"></div>
      </section>
      <section class="view" id="view-scm">
        <div class="view-head">
          <span class="view-title">Source Control</span>
          <button class="icon-btn" data-act="scmRefresh" title="Refresh"></button>
          <button class="icon-btn" data-act="scmMore" title="More actions"></button>
        </div>
        <div class="view-body" id="scm-body"></div>
      </section>
      <section class="view" id="view-outline">
        <div class="view-head"><span class="view-title" id="outline-title">Outline</span></div>
        <div class="search-box"><div class="sinput"><input id="outline-filter" placeholder="Filter symbols" spellcheck="false"></div></div>
        <div class="view-body" id="outline-body"></div>
      </section>
      <section class="view" id="view-plugins">
        <div class="view-head"><span class="view-title">Plugins</span></div>
        <div class="view-body" id="plugins-body"></div>
      </section>
      <section class="view" id="view-settings">
        <div class="view-head"><span class="view-title">Settings</span></div>
        <div class="view-body" id="settings-body"></div>
      </section>
    </aside>
    <div class="split-x" id="split-sidebar"></div>

    <main id="center">
      <div id="tabbar"></div>
      <div id="crumbs"></div>
      <div id="editor-wrap">
        <div id="monaco"></div>
        <div id="image-view"><img alt=""><div class="meta"></div></div>
        <div id="welcome"></div>
        <div id="diffview"><div class="dv-bar"><span class="dv-title" id="dv-title"></span><span class="dv-actions" id="dv-actions"></span></div><div id="dv-editor"></div></div>
        <div id="side-view"><div class="sv-head"><span class="sv-title"></span><button class="icon-btn" id="side-close" title="Close"></button></div><div class="sv-body"></div></div>
        <div id="ai-progress"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg><span id="ai-progress-text"></span><small id="ai-progress-count"></small><button id="ai-progress-cancel">Cancel · Esc</button></div>
      </div>
      <div class="split-y" id="term-split"></div>
      <section id="term-panel">
        <div id="term-head">
          <button class="ptab active" data-ptab="terminal">Terminal</button>
          <button class="ptab" data-ptab="problems">Problems<span class="pcount" id="problems-count"></span></button>
          <span class="tsub" id="term-sub"></span>
          <span class="term-only">
            <button class="icon-btn" data-act="runTask" title="Run task (Ctrl+Shift+B)"></button>
            <button class="icon-btn" data-act="runFile" title="Run active file (F5)"></button>
            <button class="icon-btn" data-act="termClear" title="Clear"></button>
            <button class="icon-btn" data-act="termRestart" title="Restart shell"></button>
          </span>
          <button class="icon-btn" data-act="termMax" title="Maximize panel"></button>
          <button class="icon-btn" data-act="termHide" title="Hide (Ctrl+`)"></button>
        </div>
        <div id="xterm"></div>
        <div id="problems-view"></div>
      </section>
    </main>

    <div class="split-x" id="split-chat"></div>
    <aside id="chat">
      <div id="chat-head">
        <span class="ch-title">Chat</span>
        <button class="icon-btn" data-act="newChat" title="New chat"></button>
        <button class="icon-btn" data-act="chatHide" title="Hide chat (Ctrl+Alt+B)"></button>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <div id="slash"></div>
        <div id="input-box">
          <textarea id="chat-input" rows="1" spellcheck="false" placeholder="Ask ocode to build, fix, or explain…"></textarea>
          <div class="input-row">
            <button class="chip-btn" id="ci-model" title="Chat model"></button>
            <button class="chip-btn" id="ci-effort" title="Effort — how hard ocode thinks"></button>
            <button class="chip-btn" id="ci-file"></button>
            <button class="chip-btn" id="ci-mode"></button>
            <span class="spacer"></span>
            <button id="send-btn" title="Send"></button>
          </div>
        </div>
        <div class="input-hint"><span><b>⏎</b> send</span><span><b>⇧⏎</b> new line</span><span><b>/</b> commands</span></div>
      </div>
    </aside>
  </div>

  <footer id="statusbar">
    <div class="grp" id="sb-left"></div>
    <div class="spacer"></div>
    <div class="grp" id="sb-right"></div>
  </footer>
</div>

<div id="quick-back"><div id="quick"><div id="quick-title"></div><div class="q-in"><input id="quick-input" spellcheck="false" autocomplete="off"></div><div id="quick-list"></div></div></div>
<div id="review"><div class="rv">
  <div class="rv-head"><span id="review-logo"></span><span class="rv-title" id="review-title"></span><span class="rv-sub">You can edit the right side before accepting</span>
    <button class="btn" id="review-reject">Reject<kbd>Esc</kbd></button><button class="btn primary" id="review-accept">Accept<kbd>Ctrl ⏎</kbd></button></div>
  <div id="review-diff"></div>
</div></div>
<div id="multi"><div class="rv">
  <div class="rv-head"><span id="multi-logo"></span><span class="rv-title" id="multi-title"></span><span class="rv-sub mv-status" id="multi-status"></span>
    <button class="btn" id="multi-stop">Stop</button>
    <button class="btn" id="multi-cancel">Discard<kbd>Esc</kbd></button>
    <button class="btn primary" id="multi-apply">Apply<kbd>Ctrl ⏎</kbd></button></div>
  <div class="mv-body"><div class="mv-files" id="multi-files"></div><div class="mv-main"><div class="mv-why" id="multi-why"></div><div id="multi-diff"></div></div></div>
</div></div>
<div id="ctxmenu"></div>
<div id="popover" tabindex="-1"></div>
<div id="toasts"></div>

const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

let term = null, fit = null, ws = null, termDead = false, termQueue = [];
const wsSend = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
async function initTerm() {
  try { await document.fonts.load(`${S.terminalFontSize}px ${S.fontFamily.split(',')[0]}`); } catch {}
  term = new Terminal({ fontFamily: S.fontFamily, fontSize: S.terminalFontSize, lineHeight: 1.25, cursorBlink: true, cursorStyle: 'bar', scrollback: 10000,
    theme: xtermTheme(THEMES[S.theme] || THEMES.ocode), allowProposedApi: true, macOptionIsMeta: true });

const TOOL_META = { read_file: ['file', 'Read'], write_file: ['filePlus', 'Write'], create_file: ['filePlus', 'Write'], edit_file: ['edit', 'Edit'], list_files: ['folder', 'List'], run_command: ['terminal', 'Run'], search: ['search', 'Search'], find_files: ['search', 'Find'] };
function appendTool(container, name, args) {
  const [ic, verb] = TOOL_META[name] || ['zap', name];
  const target = args.command || (args.pattern ? `${args.pattern}${args.glob ? `  (${args.glob})` : ''}` : '') || args.glob || args.path || '';
  const blk = h('div', { class: 'tool' });
  const head = h('div', { class: 'tool-head', onclick: () => blk.classList.toggle('open'),
    html: `${icon(ic)}<span class="tool-verb">${esc(verb)}</span><span class="tool-target">${esc(target)}</span><span class="tool-status running"></span>${icon('chev', 'tool-chev')}` });
  if (args.path && !args.pattern && !args.glob) { const tg = $('.tool-target', head); tg.classList.add('link'); tg.onclick = e => { e.stopPropagation(); openFile(absPath(args.path)); }; }
  const body = h('div', { class: 'tool-body' });
  if (name === 'edit_file') {
    const pre = h('pre', { class: 'diff' });
    for (const l of String(args.old_string ?? '').split('\n')) pre.append(h('div', { class: 'del' }, '- ' + l));
    for (const l of String(args.new_string ?? '').split('\n')) pre.append(h('div', { class: 'add' }, '+ ' + l));
    body.append(pre);
  } else if (name === 'write_file' || name === 'create_file') body.append(h('pre', {}, String(args.content ?? '').slice(0, 5000)));
  blk.append(head, body); blk._name = name; blk._args = args;
  container.append(blk); scrollChat();
  return blk;
}
function finishTool(blk, result, replay = false) {
  if (!blk) return;
  const err = /^Error/.test(result), st = $('.tool-status', blk);
  st.className = 'tool-status ' + (err ? 'err' : 'ok'); st.textContent = err ? 'failed' : '✓';
  $('.tool-body', blk).append(h('pre', { class: 'tool-result' + (err ? ' err' : '') }, result.slice(0, 6000)));
  if (err && !replay) blk.classList.add('open');
  if (replay) return;
  const a = blk._args;
  if (!err && ['write_file', 'create_file', 'edit_file'].includes(blk._name) && a.path) {
    const p = absPath(a.path);
    invalidateFileIndex(); refreshTreeSoon();
    reloadIfOpen(p).then(open => { if (!open) openFile(p, { noFocus: true, silent: true }); });
  } else if (blk._name === 'run_command') { invalidateFileIndex(); refreshTreeSoon(); }

async function* sse(resp) {
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of chunk.split('\n')) if (line.startsWith('data: ')) yield JSON.parse(line.slice(6));
    }
  }
}

function setBusy(v) {
  busy = v;
  const b = $('#send-btn');
  b.classList.toggle('busy', v);
  b.innerHTML = v ? icon('stop', 'fill') : icon('up');
  b.title = v ? 'Stop' : 'Send';

async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || busy) return;
  if (text.startsWith('/')) return dispatchSlash(text);
  setPanel('chat', true);
  appendUser(text);
  const content = await expandMentions(text);
  chatMessages.push(content === text ? { role: 'user', content } : { role: 'user', content, shown: text });
  setBusy(true);
  const turn = appendTurn();
  abortCtl = new AbortController();
  let aiText = '', lastTool = null, live = null, liveText = '', think = null, history = null, stats = null, frame = 0;
  const started = performance.now();
  // Streamed text is rendered at most once per animation frame so long answers stay smooth.
  const paint = () => {
    frame = 0;
    if (!live) return;
    const stick = nearBottom();
    live.replaceChildren(...renderMarkdown(liveText).childNodes);
    if (stick) scrollChat();
  };
  const endLive = () => { if (frame) cancelAnimationFrame(frame), frame = 0; if (live) { paint(); live.classList.remove('m-live'); } live = null; liveText = ''; };
  try {
    await getFileIndex().catch(() => {});
    const resp = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: abortCtl.signal,
      body: JSON.stringify({ messages: chatMessages.map(({ shown, nudge, ...m }) => m), model: S.model, cwd: S.cwd, system: getSystemPrompt(), think: thinkOn() }) });
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
    for await (const ev of sse(resp)) {
      if (ev.type === 'delta') {
        turn.thinking(false);
        if (!live) { live = h('div', { class: 'md m-live' }); turn.body.append(live); }
        liveText += ev.content;
        if (!frame) frame = requestAnimationFrame(paint);
        continue;
      }
      if (ev.type === 'thinking') {
        if (!think) { think = h('div', { class: 'm-think' }); turn.body.append(think); }
        think.textContent += ev.content; think.scrollTop = think.scrollHeight;
        continue;
      }
      if (ev.type === 'retract') { if (frame) cancelAnimationFrame(frame), frame = 0; live?.remove(); live = null; liveText = ''; continue; }
      if (ev.type === 'notice') { turn.body.append(h('div', { class: 'chat-note' }, ev.content)); turn.thinking(true); continue; }
      if (ev.type === 'message') {
        aiText = ev.content || '';
        if (live) endLive(); else turn.body.append(renderMarkdown(aiText || '_(empty response)_'));
      }
      else if (ev.type === 'tool_call') {
        endLive(); think = null; turn.thinking(!ev.approval); lastTool = appendTool(turn.body, ev.name, ev.args || {});
        if (ev.approval) askApproval(lastTool, ev.approval, turn);
      }
      else if (ev.type === 'tool_result') finishTool(lastTool, ev.result || '');
      else if (ev.type === 'history') history = ev.messages;
      else if (ev.type === 'stats') stats = ev;
      else if (ev.type === 'error') { endLive(); turn.body.append(h('div', { class: 'chat-error' }, ev.content)); }
      if (nearBottom()) scrollChat();
    }
  } catch (e) {
    endLive();
    denyPendingApprovals();
    turn.body.append(e.name === 'AbortError' ? h('div', { class: 'chat-note' }, 'Stopped.') : h('div', { class: 'chat-error' }, 'Request failed: ' + e.message));
  }
  endLive();
  turn.thinking(false);
  $$('.tool-status.running', turn.body).forEach(s => { s.className = 'tool-status err'; s.textContent = 'stopped'; });
  // Keep the agent's tool calls and results in the conversation so follow-ups know what it already did.
  if (history?.length) chatMessages.push(...history);
  else if (aiText) chatMessages.push({ role: 'assistant', content: aiText });
  else if (chatMessages.at(-1)?.role === 'user' && (chatMessages.at(-1).shown ?? chatMessages.at(-1).content) === text) chatMessages.pop();
  saveChat();
  const secs = (performance.now() - started) / 1000;
  if (aiText || stats) {
    const tps = stats?.seconds > 0 ? Math.round(stats.tokens / stats.seconds) : 0;
    turn.wrap.append(h('div', { class: 'm-stats' }, [tps && `${tps} tok/s`, stats?.tokens && `${stats.tokens} tokens`, `${secs.toFixed(1)}s`].filter(Boolean).join(' · ')));
  }
  if (aiText) {
    turn.actions.append(
      h('button', { title: 'Copy response', html: icon('copy'), onclick: () => copyText(aiText) }),
      h('button', { title: 'Retry', html: icon('refresh'), onclick: () => retryLast() }));
  }
  abortCtl = null; setBusy(false); if (nearBottom()) scrollChat();
  emit('chatResponse', aiText);
}
// Drop the last exchange and ask the same question again.
function retryLast() {
  if (busy) return;
  const i = chatMessages.findLastIndex(m => m.role === 'user' && !m.nudge);
  if (i < 0) return;
  const q = chatMessages[i].shown ?? chatMessages[i].content;
  chatMessages = chatMessages.slice(0, i);
  const turns = $$('#messages > .m-user'), lastUser = turns.at(-1);
  if (lastUser) { let n = lastUser; while (n) { const next = n.nextElementSibling; n.remove(); n = next; } }
  sendChat(q);
}

                  : 'Unrestricted mode off.');

const pendingApprovals = new Set();
function askApproval(blk, id, turn) {
  pendingApprovals.add(id);
  blk.classList.add('open');
  const answer = allow => {
    pendingApprovals.delete(id);
    row.replaceChildren(h('span', {}, allow ? 'Allowed' : 'Declined'));
    setTimeout(() => row.remove(), 800);

  };
  const row = h('div', { class: 'approve' }, h('span', {}, 'Run this command?'), h('span', { class: 'spacer' }),
    h('button', { class: 'btn', onclick: () => answer(false) }, 'Decline'),

// ── @file mentions: the file's contents are sent along with the message ──
const MENTION_RE = /(^|\s)@([\w.\/-]+)/g;
async function expandMentions(text) {
  const files = new Set(fileIndex.root === S.cwd ? fileIndex.files : []);
  const found = [...new Set([...text.matchAll(MENTION_RE)].map(m => m[2].replace(/[.,;:!?)]+$/, '')))].filter(f => files.has(f));
  if (!found.length) return text;
  const parts = await Promise.all(found.slice(0, 8).map(async f => {
    try {
      const d = await api('/api/file?path=' + enc(S.cwd + '/' + f));
      if (d.binary || d.content == null) return '';
      const body = d.content.length > 40000 ? d.content.slice(0, 40000) + '\n… (truncated)' : d.content;
      return `\n\n<file path="${f}">\n${body}\n</file>`;

  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal });

    text = keep.join('\n');
  }
  return { text: text.replace(/\s+$/, ''), complete };
}

function registerAiProviders() {
  monaco.languages.registerInlineCompletionsProvider('*', {
    async provideInlineCompletions(model, position, context, token) {
      const st = AIC.status;
      if (S.aiComplete === false || !st?.online || !st?.hasModel || model !== editor.getModel()) return { items: [] };
      const auto = context.triggerKind === monaco.languages.InlineCompletionTriggerKind.Automatic;
      const lineText = model.getLineContent(position.lineNumber), before = lineText.slice(0, position.column - 1), after = lineText.slice(position.column - 1);
      if (auto) {
        if (/\w$/.test(before) && /^\w/.test(after)) return { items: [] };
        await sleep(S.completeDelay ?? 250);
        if (token.isCancellationRequested) return { items: [] };
      }
      const full = model.getValue(), off = model.getOffsetAt(position), midLine = !!after.trim();
      const ctl = new AbortController(), sub = token.onCancellationRequested(() => ctl.abort());
      AIC.inflight?.abort(); AIC.inflight = ctl; setAiState('busy');
      let raw = '', enough = false;
      try {
        try {
          await streamText('/api/complete', {
            prefix: full.slice(Math.max(0, off - 3500), off), suffix: full.slice(off, off + 1200),
            maxTokens: midLine ? 40 : 128, stop: midLine ? ['\n'] : [],
          }, ctl.signal, t => {
            raw = t;
            // Generation slows down with context on smaller GPUs, so stop as soon as the suggestion is complete.
            if (!enough && cleanCompletion(t, lineText, position.column).complete) { enough = true; ctl.abort(); }
          });
        } catch (e) { if (!(e.name === 'AbortError' && enough)) throw e; }
        const { text } = cleanCompletion(raw, lineText, position.column);
        if (!text.trim() || token.isCancellationRequested) return { items: [] };
        return { items: [{ insertText: text, range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column) }] };
      } catch (e) {
        if (e.name !== 'AbortError') { console.warn('[autocomplete]', e); if (!auto) toast('Autocomplete failed: ' + e.message, 'error'); checkCompleteStatus(); }
        return { items: [] };
      } finally {
        sub.dispose();
        if (AIC.inflight === ctl) { AIC.inflight = null; setAiState('idle'); }
      }
    },
    freeInlineCompletions() {},
    disposeInlineCompletions() {},
  });

  monaco.editor.registerCommand('ocode.aiFix', (_a, marker) => aiFixMarker(marker));
  monaco.editor.registerCommand('ocode.aiEditRange', (_a, range) => aiEdit({ range }));
  monaco.languages.registerCodeActionProvider('*', {
    provideCodeActions(model, range, context) {
      const actions = (context.markers || []).filter(m => m.severity >= monaco.MarkerSeverity.Warning).slice(0, 3).map(m => ({
        title: `✦ Fix with ocode: ${m.message.split('\n')[0].slice(0, 80)}`, kind: 'quickfix', diagnostics: [m], isPreferred: true,
        command: { id: 'ocode.aiFix', title: 'Fix with ocode', arguments: [m] } }));
      if (!monaco.Range.isEmpty(range)) actions.push({ title: '✦ Edit with ocode…', kind: 'refactor.rewrite', command: { id: 'ocode.aiEditRange', title: 'Edit with ocode', arguments: [range] } });
      return { actions, dispose() {} };
    },
  });
}

let aiProg = null;

function stripFences(t) {
  t = t.replace(/\r/g, '');
  const m = t.match(/```[^\n]*\n([\s\S]*?)(?:```|$)/);
  if (m) t = m[1];
  return t.replace(/<\/?(selection|before|after)>/g, '').replace(/^\n+/, '').replace(/\s+$/, '');

let diffEd = null;
function reviewDiff({ original, modified, language, title }) {
  return new Promise(resolve => {
    reviewOpen = true;
    $('#review-title').textContent = title || 'Review change';
    $('#review').classList.add('open');
    if (!diffEd) diffEd = monaco.editor.createDiffEditor($('#review-diff'), {
      automaticLayout: true, renderSideBySide: true, originalEditable: false, minimap: { enabled: false }, scrollBeyondLastLine: false,
      renderOverviewRuler: false, ignoreTrimWhitespace: false, hideUnchangedRegions: { enabled: true }, padding: { top: 8 } });
    diffEd.updateOptions({ fontSize: S.fontSize, fontFamily: S.fontFamily, fontLigatures: S.fontLigatures, wordWrap: S.wordWrap });
    const o = monaco.editor.createModel(original, language), m = monaco.editor.createModel(modified, language);
    diffEd.setModel({ original: o, modified: m });
    let cleanup = () => {};
    const finish = ok => {
      const val = m.getValue();
      cleanup(); reviewOpen = false;
      $('#review').classList.remove('open');
      diffEd.setModel(null); o.dispose(); m.dispose();
      if (editor.getModel()) editor.focus();
      resolve(ok ? val : null);
    };
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !e.target.closest?.('.monaco-editor'))) { e.preventDefault(); e.stopPropagation(); finish(true); }
    };
    window.addEventListener('keydown', key, true);
    cleanup = () => window.removeEventListener('keydown', key, true);
    $('#review-accept').onclick = () => finish(true);
    $('#review-reject').onclick = () => finish(false);
    setTimeout(() => diffEd.getModifiedEditor().focus(), 60);
  });
}

const AI_EDIT_SYSTEM = "You are a precise code-editing engine inside a code editor. You receive part of a file split into <before>, <selection> and <after>, plus an instruction. " +
  "Reply with exactly ONE fenced code block containing only the new code that replaces <selection> (if the selection is empty: the code to insert at that point). " +
  "Never repeat the before/after context. Write nothing before or after the code block. Match the file's existing style and indentation. Write complete, working code.";
const FENCED_BLOCK = /```[^\n]*\n[\s\S]*?```/;

const thinkOn = () => S.effort === 'high' || S.effort === 'max';
const thinkBudget = () => (thinkOn() ? 6000 : 0);

async function aiEdit({ range, instruction, title } = {}) {
  const t = tabs.get(active);
  if (t?.kind !== 'text') { toast('Open a file first', 'warn'); return; }
  const model = t.model;
  let sel = monaco.Range.lift(range || editor.getSelection());
  if (!sel.isEmpty()) sel = new monaco.Range(sel.startLineNumber, 1, sel.endLineNumber, model.getLineMaxColumn(sel.endLineNumber));
  const isInsert = sel.isEmpty();
  if (!instruction) instruction = await askInput(isInsert ? 'Edit with ocode — what should be written here?' : 'Edit with ocode — how should the selected code change?', '',
    isInsert ? 'e.g. "a function that parses a CSV file into a list of dicts"' : 'e.g. "add error handling", "make it async", "add comments"');
  if (!instruction) return;
  const original = model.getValueInRange(sel);
  const before = model.getValueInRange(new monaco.Range(Math.max(1, sel.startLineNumber - 80), 1, sel.startLineNumber, sel.startColumn));
  const endLine = Math.min(model.getLineCount(), sel.endLineNumber + 40);
  const after = model.getValueInRange(new monaco.Range(sel.endLineNumber, sel.endColumn, endLine, model.getLineMaxColumn(endLine)));
  const lang = model.getLanguageId();
  const [deco] = model.deltaDecorations([], [{ range: sel, options: { stickiness: monaco.editor.TrackedRangeStickiness.NeverGrowsWhenTypingAtEdges, className: isInsert ? '' : 'ai-editing', isWholeLine: !isInsert } }]);
  const prog = showAiProgress(isInsert ? 'ocode is writing code…' : 'ocode is editing…');
  let out = '', gotBlock = false;
  try {
    await streamText('/api/ai', { system: AI_EDIT_SYSTEM, temperature: 0.2, think: thinkOn(), maxTokens: Math.ceil(original.length / 3) + (isInsert ? 1500 : 600) + thinkBudget(),
      prompt: `File: ${rel(t.path)} (${lang})\n\n<before>\n${before}\n</before>\n<selection>\n${original}\n</selection>\n<after>\n${after}\n</after>\n\n` +
        `Instruction: ${instruction}\n\nReply with one \`\`\`${lang} code block only.` },
      prog.ctl.signal, txt => {
        out = txt; prog.update(txt);
        // Small local models often keep talking after the code; stop as soon as the block closes.
        if (!gotBlock && FENCED_BLOCK.test(txt)) { gotBlock = true; prog.ctl.abort(); }
      });
  } catch (e) {
    if (!(e.name === 'AbortError' && gotBlock)) {
      prog.done();
      if (!model.isDisposed()) model.deltaDecorations([deco], []);
      if (e.name !== 'AbortError') toast('ocode edit failed: ' + e.message, 'error');
      return;
    }
  }
  prog.done();
  if (model.isDisposed()) return;
  const target = model.getDecorationRange(deco) || sel;
  out = stripFences(out);
  if (/\n$/.test(original) && out && !out.endsWith('\n')) out += '\n';
  if (isInsert &&!model.getLineContent(target.startLineNumber).slice(0, target.startColumn - 1).trim()) out = out.replace(/^[ \t]+/, '');
  if (!out.trim()) { model.deltaDecorations([deco], []); toast('ocode returned no code', 'warn'); return; }
  if (out === original) { model.deltaDecorations([deco], []); toast('ocode suggested no changes', 'ok'); return; }
  const result = await reviewDiff({ original, modified: out, language: lang, title: title || instruction });
  if (model.isDisposed()) return;
  const finalRange = model.getDecorationRange(deco) || target;
  model.deltaDecorations([deco], []);
  if (result == null) return;
  if (isDirty(t)) await saveTab(t);
  await post('/api/history/snap', { paths: [t.path], label: 'ai' }).catch(() => {});
  if (editor.getModel() === model) {
    editor.pushUndoStop();
    editor.executeEdits('ocode', [{ range: finalRange, text: result, forceMoveMarkers: true }]);
    editor.pushUndoStop();
    editor.focus();
  } else model.pushEditOperations([], [{ range: finalRange, text: result }], () => null);
  toast('Change applied — Ctrl+Z to undo', 'ok', 2200);
}

function aiFixMarker(m) {

  return aiEdit({ range: new monaco.Range(start, 1, end, model.getLineMaxColumn(end)), title: `Fix: ${m.message.split('\n')[0]}`,
    instruction: `Fix this ${sev} reported on line ${m.startLineNumber}${m.source ? ` by ${m.source}` : ''}: "${m.message}". Change only what is needed to fix it.` });
}
